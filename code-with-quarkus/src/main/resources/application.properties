# ========================================================
# CONFIGURACIÓN DE BASE DE DATOS (POSTGRESQL)
# ========================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/inventario_setab
quarkus.datasource.username=postgres
quarkus.datasource.password=PoSGret18
quarkus.hibernate-orm.database.generation=update

quarkus.http.host=0.0.0.0

# ========================================================
# CONFIGURACIÓN DE SEGURIDAD CON KEYCLOAK (OIDC)
# ========================================================
quarkus.oidc.auth-server-url=http://192.168.137.220:8081/realms/setab-erp
quarkus.oidc.client-id=setab-frontend
quarkus.oidc.application-type=service

# ¡NUEVA LÍNEA CLAVE! Ignora si el token dice localhost o IP
quarkus.oidc.token.issuer=any

# Extraer el nombre de usuario
quarkus.oidc.token.principal-claim=preferred_username

# Ruta exacta para encontrar los roles dentro del Access Token
quarkus.oidc.roles.role-claim-path=realm_access/roles

# ========================================================
# DEBUG DE SEGURIDAD
# ========================================================
quarkus.log.category."io.quarkus.security".level=DEBUG
quarkus.log.category."io.quarkus.oidc".level=DEBUG