<!DOCTYPE html>
<html lang="es" x-data="{ temaOscuro: localStorage.getItem('tema') === 'dark' }"
    x-init="$watch('temaOscuro', val => localStorage.setItem('tema', val ? 'dark' : 'light'))"
    :class="{ 'dark': temaOscuro }">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Central - INVENTARIOS SETAB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../rutas/config.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        guinda: { DEFAULT: '#981A35', dark: '#691C32' },
                        dorado: { DEFAULT: '#BC955C' },
                        caqui: { DEFAULT: '#F3F0E5', dark: '#E5DFD1' }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script defer src="https://unpkg.com/html5-qrcode"></script>
    <style>
        [x-cloak] {
            display: none !important;
        }

        select[size] {
            height: auto;
            max-height: 150px;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .canvas-firma {
            border: 2px dashed #cbd5e1;
            border-radius: 0.5rem;
            background-color: #f8fafc;
            cursor: crosshair;
            touch-action: none;
        }

        html,
        body,
        p,
        div,
        span,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        input,
        button,
        select,
        textarea,
        table,
        th,
        td,
        label {
            font-family: 'Montserrat', sans-serif;
        }

        main table {
            border-collapse: collapse !important;
            width: 100%;
        }

        main table thead tr,
        main table thead th {
            background-color: #691C32 !important;
            color: #FFFFFF !important;
            font-size: 11px !important;
            letter-spacing: 0.04em !important;
            font-weight: 700 !important;
            text-transform: uppercase !important;
            border-bottom: 3px solid #BC955C !important;
        }

        main table th,
        main table td {
            border: 1px solid #DDD6C5 !important;
            padding: 10px 12px !important;
        }

        main table tbody tr:nth-child(odd) {
            background-color: #FFFFFF;
        }

        main table tbody tr:nth-child(even) {
            background-color: #F8F6EE;
        }

        main table tbody tr:hover {
            background-color: #EFE9D8 !important;
        }
    </style>
</head>

                x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 scale-100"

    <script>
        function layoutMaestro() {
            const DURACION_MAX_SESION_MS = 8 * 60 * 60 * 1000;
            const rawInicio = sessionStorage.getItem('inicioSesionSETAB') || localStorage.getItem('inicioSesionSETAB');
            const tsInicio = rawInicio ? parseInt(rawInicio, 10) : Date.now();
            const sesionVigente = !isNaN(tsInicio) && (Date.now() - tsInicio < DURACION_MAX_SESION_MS);

            if (sesionVigente && !sessionStorage.getItem('tokenSETAB') && localStorage.getItem('tokenSETAB')) {
                sessionStorage.setItem('tokenSETAB', localStorage.getItem('tokenSETAB'));
                sessionStorage.setItem('inicioSesionSETAB', String(tsInicio));
                if (localStorage.getItem('refreshTokenSETAB')) sessionStorage.setItem('refreshTokenSETAB', localStorage.getItem('refreshTokenSETAB'));
                if (localStorage.getItem('idTokenSETAB')) sessionStorage.setItem('idTokenSETAB', localStorage.getItem('idTokenSETAB'));
                if (localStorage.getItem('rolSETAB')) sessionStorage.setItem('rolSETAB', localStorage.getItem('rolSETAB'));
                if (localStorage.getItem('nombreSETAB')) sessionStorage.setItem('nombreSETAB', localStorage.getItem('nombreSETAB'));
            } else if (!sessionStorage.getItem('inicioSesionSETAB') && sessionStorage.getItem('tokenSETAB')) {
                const ahora = String(Date.now());
                sessionStorage.setItem('inicioSesionSETAB', ahora);
                localStorage.setItem('inicioSesionSETAB', ahora);
            }

            const rawRol = (sessionStorage.getItem('rolSETAB') || localStorage.getItem('rolSETAB') || '').replace(/['"]+/g, '').trim();
            const rolNormalizado = rawRol.toUpperCase() === 'SUPERADMIN' ? 'SUPERADMIN' : (rawRol.toLowerCase() === 'admin' ? 'admin' : rawRol);

            return {
                sidebarAbierto: false,
                token: sessionStorage.getItem('tokenSETAB') ? sessionStorage.getItem('tokenSETAB').replace(/['"]+/g, '') : null,
                refreshToken: sessionStorage.getItem('refreshTokenSETAB') ? sessionStorage.getItem('refreshTokenSETAB').replace(/['"]+/g, '') : null,
                inicioSesion: tsInicio,
                duracionMaxSesionMs: DURACION_MAX_SESION_MS,
                _promesaRefresh: null,

                get metricasReporte() {
                    const lista = this.articulosReporteFiltrados;
                    const stockTotal = lista.reduce((acc, item) => acc + (Number(item.cantidadStock) || 0), 0);
                    const valorTotal = lista.reduce((acc, item) => {
                        const unitario = Number(item.valorInicial || item.precio || 0);
                        const cant = Number(item.cantidadStock) > 0 ? Number(item.cantidadStock) : 1;
                        return acc + (unitario * cant);
                    }, 0);
                    return {
                        stockTotal: stockTotal,
                        valorTotalNum: valorTotal,
                        valorPatrimonial: valorTotal.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
                    };
                },

                get filasCuantificacion() {
                    const lista = this.articulosReporteFiltrados;
                    const grupos = {};
                    let granTotal = 0;
                    const modo = (this.tipoCuantificacion || 'PARTIDA').toLowerCase();

                    for (const a of lista) {
                        let clave = 'SIN CLASIFICAR';
                        let desc = 'Sin especificar';

                        if (modo === 'partida') {
                            clave = (a.partida || 'SIN PARTIDA').trim().toUpperCase();
                            desc = a.cuentaContable ? `Cuenta Contable: ${a.cuentaContable} (${a.naturalezaGasto || 'Gasto General'})` : (a.naturalezaGasto || 'Partida Presupuestal SETAB');
                        } else if (modo === 'cct_articulo') {
                            const cct = (a.centroTrabajo || a.areaUbicacion || 'ALMACÉN CENTRAL').trim().toUpperCase();
                            const tipo = (a.tipoMaterial || a.categoria || 'BIEN GENERAL').trim().toUpperCase();
                            clave = `${cct} — ${tipo}`;
                            desc = `Resguardante: ${a.resguardanteActual || a.responsable || 'Custodia Central'} | Fondo: ${a.fondoOrigen || 'OFICIAL'}`;
                        } else if (modo === 'tipo_articulo') {
                            clave = (a.tipoMaterial || a.categoria || 'SIN TIPO').trim().toUpperCase();
                            desc = a.subClave ? `Subclave: ${a.subClave} | Categoría: ${a.categoria || 'General'}` : `Categoría: ${a.categoria || 'General'}`;
                        } else if (modo === 'proveedor_pedido' || modo === 'proveedor_factura') {
                            const prov = (a.proveedor || 'SIN PROVEEDOR').trim().toUpperCase();
                            const ped = (a.pedido || 'S/PED').trim().toUpperCase();
                            const fac = (a.factura || 'S/FACT').trim().toUpperCase();
                            clave = `${prov}`;
                            desc = `Pedido: ${ped} | Factura: ${fac} ${a.fechaFactura ? '(' + a.fechaFactura + ')' : ''}`;
                        }

                        const groupKey = `${clave}||${desc}`;
                        if (!grupos[groupKey]) {
                            grupos[groupKey] = {
                                clave,
                                grupo: clave,
                                descripcion: desc,
                                subgrupo: desc,
                                cantidadRegistros: 0,
                                cantidad: 0,
                                stockTotal: 0,
                                subtotal: 0,
                                importeTotal: 0,
                                importe: 0
                            };
                        }

                        const cant = Number(a.cantidadStock) > 0 ? Number(a.cantidadStock) : 1;
                        const unitario = Number(a.valorInicial || a.precio || 0);
                        const subUnitario = Number(a.precioSinIva) > 0 ? Number(a.precioSinIva) : (unitario / 1.16);
                        const impFila = unitario * cant;

                        grupos[groupKey].cantidadRegistros += 1;
                        grupos[groupKey].cantidad = grupos[groupKey].cantidadRegistros;
                        grupos[groupKey].stockTotal += (Number(a.cantidadStock) || 0);
                        grupos[groupKey].subtotal += (subUnitario * cant);
                        grupos[groupKey].importeTotal += impFila;
                        grupos[groupKey].importe = grupos[groupKey].importeTotal;
                        granTotal += impFila;
                    }

                    return Object.values(grupos)
                        .sort((x, y) => y.importeTotal - x.importeTotal)
                        .map(g => ({
                            ...g,
                            porcentaje: granTotal > 0 ? ((g.importeTotal / granTotal) * 100).toFixed(2) : '0.00'
                        }));
                },

                get totalesCuantificacion() {
                    const filas = this.filasCuantificacion;
                    const registros = filas.reduce((acc, f) => acc + f.cantidadRegistros, 0);
                    const stock = filas.reduce((acc, f) => acc + f.stockTotal, 0);
                    const subtotal = filas.reduce((acc, f) => acc + f.subtotal, 0);
                    const total = filas.reduce((acc, f) => acc + f.importeTotal, 0);
                    return {
                        registros,
                        cantidad: registros,
                        stock,
                        subtotal,
                        importe: total,
                        subtotalFmt: subtotal.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
                        totalFmt: total.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
                    };
                },

                async subirEvidenciaFotografica(idArticulo, event, itemRef = null) {
                    const file = event && event.target && event.target.files ? event.target.files[0] : null;
                    if (!file || !idArticulo) return;

                    try {
                        const base64Comprimida = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = (e) => {
                                const img = new Image();
                                img.onload = () => {
                                    const maxDim = 800;
                                    let w = img.width;
                                    let h = img.height;
                                    if (w > maxDim || h > maxDim) {
                                        if (w > h) {
                                            h = Math.round((h * maxDim) / w);
                                            w = maxDim;
                                        } else {
                                            w = Math.round((w * maxDim) / h);
                                            h = maxDim;
                                        }
                                    }
                                    const canvas = document.createElement('canvas');
                                    canvas.width = w;
                                    canvas.height = h;
                                    const ctx = canvas.getContext('2d');
                                    ctx.drawImage(img, 0, 0, w, h);
                                    resolve(canvas.toDataURL('image/jpeg', 0.78));
                                };
                                img.onerror = reject;
                                img.src = e.target.result;
                            };
                            reader.onerror = reject;
                            reader.readAsDataURL(file);
                        });

                        const resp = await fetch(`${SETAB_CONFIG.backendUrl}/api/bienes/${idArticulo}/imagen`, {
                            method: 'PUT',
                            mode: 'cors',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.token}`
                            },
                            body: JSON.stringify({ imagenBienBase64: base64Comprimida })
                        });

                        if (resp.ok) {
                            if (itemRef) itemRef.imagenBienBase64 = base64Comprimida;
                            const artEnLista = this.articulos.find(a => String(a.id) === String(idArticulo));
                            if (artEnLista) artEnLista.imagenBienBase64 = base64Comprimida;
                            if (this.articuloSeleccionado && String(this.articuloSeleccionado.id) === String(idArticulo)) {
                                this.articuloSeleccionado.imagenBienBase64 = base64Comprimida;
                            }
                            this.notificar("Evidencia fotográfica guardada y registrada en trazabilidad.", "exito");
                        } else {
                            this.notificar("No se pudo guardar la fotografía del bien.", "error");
                        }
                    } catch (err) {
                        console.error(err);
                        this.notificar("Error al procesar la imagen.", "error");
                    } finally {
                        if (event && event.target) event.target.value = '';
                    }
                },

                async reclasificarFondoArticulo(articulo) {
                    if (!articulo || !articulo.id) return;
                    const fondoActual = (articulo.fondoOrigen || 'INTERNO').toUpperCase();

                    const nuevoFondo = prompt(

                        sugerido
                    );
                    if (!nuevoFondo) return;
                    const destinoLimpio = nuevoFondo.trim().toUpperCase();
                    if (!['INTERNO', 'OFICIAL', 'OFICIAL_DESEGREGADOS'].includes(destinoLimpio)) {
                        this.notificar("Base destino inválida. Use INTERNO, OFICIAL u OFICIAL_DESEGREGADOS.", "error");
                        return;
                    }
                    try {
                        const resp = await fetch(`${SETAB_CONFIG.backendUrl}/api/bienes/${articulo.id}/reclasificar-fondo`, {
                            method: 'PUT',
                            mode: 'cors',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.token}`
                            },
                            body: JSON.stringify({ nuevoFondo: destinoLimpio })
                        });
                        if (resp.ok) {
                            const actualizado = await resp.json();
                            this.articuloSeleccionado.fondoOrigen = actualizado.fondoOrigen;
                            this.articuloSeleccionado.numeroInventario = actualizado.numeroInventario;
                            this.articuloSeleccionado.numeroInventarioAnterior = actualizado.numeroInventarioAnterior;
                            this.cargarArticulos();
                            this.notificar(`Bien reclasificado a ${actualizado.fondoOrigen} con folio ${actualizado.numeroInventario}`, "exito");
                        } else {
                            const err = await resp.json().catch(() => ({}));
                            this.notificar(err.error || "Error al reclasificar el bien.", "error");
                        }
                    } catch (e) {
                        this.notificar("Error de conexión al reclasificar.", "error");
                    }
                },

                estaActualizadoAnual(emp) {
                    if (!emp) return false;
                    const verificados = this.cctsVerificadosAnual || {};
                    const idKey = emp.id_empleado ? String(emp.id_empleado) : '';
                    const cctKey = (emp.cct || '').trim().toUpperCase();
                    if ((idKey && verificados[idKey]) || (cctKey && verificados[cctKey])) {
                        return true;
                    }
                    const nomKey = (emp.nombre || '').trim().toUpperCase();
                    if (Array.isArray(this.articulos) && this.articulos.length > 0) {
                        return this.articulos.some(a => {
                            if (!a) return false;
                            const coincideCct = cctKey && a.centroTrabajo && a.centroTrabajo.trim().toUpperCase() === cctKey;
                            const coincideResp = nomKey && a.resguardanteActual && a.resguardanteActual.trim().toUpperCase() === nomKey;
                            if (!coincideCct && !coincideResp) return false;
                            const verif = (a.estadoVerificacionAnual || '').toUpperCase() === 'VERIFICADO';
                            const folioCre = (a.folioResguardo || '').toUpperCase();
                            const tieneCre2026 = folioCre.endsWith('-CRE') && (folioCre.includes('2026') || folioCre.includes('26'));
                            return verif || tieneCre2026;
                        });
                    }
                    return false;
                },

                get resumenActualizacionAnual() {
                    const lista = Array.isArray(this.empleados) && this.empleados.length > 0 ? this.empleados : (this.empleadosGeneral || []);
                    const total = lista.length;
                    let actualizados = 0;
                    for (const emp of lista) {
                        if (this.estaActualizadoAnual(emp)) {
                            actualizados++;
                        }
                    }
                    return {
                        total,
                        actualizados,
                        pendientes: Math.max(0, total - actualizados)
                    };
                },

                get directoresActualizacionFiltrados() {
                    const lista = Array.isArray(this.empleados) && this.empleados.length > 0 ? this.empleados : (this.empleadosGeneral || []);
                    const estatus = (this.filtroEstatusAnual || 'TODOS').toUpperCase();
                    const filtradosPorEstatus = lista.filter(e => {
                        if (estatus === 'PENDIENTES') return !this.estaActualizadoAnual(e);
                        if (estatus === 'ACTUALIZADOS') return this.estaActualizadoAnual(e);
                        return true;
                    });
                    if (!this.busquedaActualizacionAnual || !this.busquedaActualizacionAnual.trim()) {
                        return filtradosPorEstatus.slice(0, 80);
                    }
                    const term = this.busquedaActualizacionAnual.trim().toLowerCase();
                    return filtradosPorEstatus.filter(e => {
                        const matchEmp = (e.nombre && e.nombre.toLowerCase().includes(term)) ||
                            (e.cct && e.cct.toLowerCase().includes(term)) ||
                            (e.rfc && e.rfc.toLowerCase().includes(term)) ||
                            (e.curp && e.curp.toLowerCase().includes(term)) ||
                            (e.nombreEscuela && e.nombreEscuela.toLowerCase().includes(term));
                        if (matchEmp) return true;
                        return this.articulos.some(a =>
                            (a.folioResguardo && a.folioResguardo.toLowerCase().includes(term)) &&
                            ((a.centroTrabajo && e.cct && a.centroTrabajo.toUpperCase() === e.cct.toUpperCase()) ||
                             (a.resguardanteActual && e.nombre && a.resguardanteActual.toUpperCase() === e.nombre.toUpperCase()))
                        );
                    }).slice(0, 80);
                },

                async seleccionarDirectorActualizacion(emp) {
                    if (!emp) return;
                    this.directorActualizacionSeleccionado = emp;
                    const usuarioMatch = (this.usuarios || []).find(u =>
                        (u.idEmpleado && u.idEmpleado === emp.id_empleado) ||
                        (u.username && emp.usuario && u.username.toUpperCase() === emp.usuario.toUpperCase())
                    );
                    this.formDirectorAnual = {
                        id_empleado: emp.id_empleado,
                        nombre: emp.nombre || '',
                        rfc: emp.rfc || '',
                        curp: emp.curp || (usuarioMatch ? usuarioMatch.curp : '') || '',
                        correo: emp.correo || (usuarioMatch ? usuarioMatch.email : '') || '',
                        telefono: emp.telefono || '',
                        cct: emp.cct || '',
                        nombreEscuela: emp.nombreEscuela || emp.area || ''
                    };

                    const cctBuscada = (emp.cct || '').trim().toUpperCase();
                    const ctMatch = (this.centrosTrabajo || []).find(c => c.claveCT && c.claveCT.trim().toUpperCase() === cctBuscada);
                    if (ctMatch) {
                        this.formCTAnual = {
                            id: ctMatch.id,
                            claveCT: ctMatch.claveCT || cctBuscada,
                            nombreCT: ctMatch.nombreCT || emp.nombreEscuela || '',
                            municipio: ctMatch.municipio || 'CENTRO',
                            localidad: ctMatch.localidad || 'VILLAHERMOSA',
                            nombreVial: ctMatch.nombreVial || '',
                            georeferencia: ctMatch.refVialid || '17.989456, -92.947506'
                        };
                    } else {
                        this.formCTAnual = {
                            id: null,
                            claveCT: cctBuscada || '27DPR0001X',
                            nombreCT: emp.nombreEscuela || emp.area || 'CENTRO EDUCATIVO SETAB',
                            municipio: 'CENTRO',
                            localidad: 'VILLAHERMOSA',
                            nombreVial: 'DOMICILIO CONOCIDO S/N',
                            georeferencia: '17.989456, -92.947506'
                        };
                    }

                    try {
                        const resp = await fetch(`${SETAB_CONFIG.backendUrl}/api/resguardos/empleado/${emp.id_empleado}`, {
                            method: 'GET',
                            mode: 'cors',
                            headers: { 'Authorization': `Bearer ${this.token}` }
                        });
                        if (resp.ok) {
                            const todos = await resp.json();
                            this.bienesActualizacionAnual = (todos || []).filter(r => r.estadoResguardo !== 'DEVUELTO' && r.estadoResguardo !== 'TRASPASADO');
                        }
                    } catch (e) {
                        console.error(e);
                    }
                },

                enviarRecordatorioAnualDirectores() {
                    this.alertaAnualActiva = true;
                    localStorage.setItem('setab_alerta_anual_2026', 'true');
                    this.filtroEstatusAnual = 'PENDIENTES';
                    const faltantes = this.resumenActualizacionAnual.pendientes;
                    this.notificar(`Recordatorio anual activado. Faltan ${faltantes} Directores / Escuelas por actualizar datos en 2026.`, "exito");
                },

                async confirmarActualizacionAnualYGenerarActas() {
                    if (!this.directorActualizacionSeleccionado || !this.formDirectorAnual.id_empleado) {
                        this.notificar("Selecciona primero un Director / Centro de Trabajo.", "error");
                        return;
                    }
                    this.guardando = true;
                    try {
                        await fetch(`${SETAB_CONFIG.backendUrl}/api/empleados/${this.formDirectorAnual.id_empleado}`, {
                            method: 'PUT',
                            mode: 'cors',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.token}` },
                            body: JSON.stringify({
                                nombre: this.formDirectorAnual.nombre,
                                rfc: this.formDirectorAnual.rfc,
                                curp: this.formDirectorAnual.curp,
                                correo: this.formDirectorAnual.correo,
                                telefono: this.formDirectorAnual.telefono,
                                cct: this.formCTAnual.claveCT,
                                nombreEscuela: this.formCTAnual.nombreCT
                            })
                        });

                        if (this.formCTAnual.id) {
                            const ctOrig = (this.centrosTrabajo || []).find(c => c.id === this.formCTAnual.id) || {};
                            await fetch(`${SETAB_CONFIG.backendUrl}/api/centros-trabajo/${this.formCTAnual.id}`, {
                                method: 'PUT',
                                mode: 'cors',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.token}` },
                                body: JSON.stringify({
                                    ...ctOrig,
                                    claveCT: this.formCTAnual.claveCT,
                                    nombreCT: this.formCTAnual.nombreCT,
                                    municipio: this.formCTAnual.municipio,
                                    localidad: this.formCTAnual.localidad,
                                    nombreVial: this.formCTAnual.nombreVial,
                                    refVialid: this.formCTAnual.georeferencia,
                                    director: this.formDirectorAnual.nombre
                                })
                            });
                        }

                        const resp = await fetch(`${SETAB_CONFIG.backendUrl}/api/resguardos/confirmar-actualizacion-anual/${this.formDirectorAnual.id_empleado}`, {
                            method: 'POST',
                            mode: 'cors',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.token}` }
                        });

                        if (resp.ok) {
                            const resultado = await resp.json();
                            const registroVerif = {
                                fecha: new Date().toISOString().split('T')[0],
                                folio: resultado.folioGenerado || '2026-CRE'
                            };
                            const copiaMapa = { ...(this.cctsVerificadosAnual || {}) };
                            if (this.formDirectorAnual.id_empleado) {
                                copiaMapa[String(this.formDirectorAnual.id_empleado)] = registroVerif;
                            }
                            if (this.formCTAnual.claveCT) {
                                copiaMapa[this.formCTAnual.claveCT.trim().toUpperCase()] = registroVerif;
                            }
                            this.cctsVerificadosAnual = copiaMapa;
                            localStorage.setItem('setab_ccts_verificados_2026', JSON.stringify(copiaMapa));

                            await this.seleccionarDirectorActualizacion(this.directorActualizacionSeleccionado);
                            this.cargarArticulos();
                            this.notificar(`Verificación anual confirmada. Nuevo folio: ${resultado.folioGenerado}`, "exito");
                            this.imprimirResguardoAnualActual();
                            setTimeout(() => {
                                this.imprimirActaVerificacionFisica(this.formDirectorAnual, this.bienesActualizacionAnual, this.formCTAnual);
                            }, 600);
                        } else {
                            this.notificar("Error al confirmar la actualización anual.", "error");
                        }
                    } catch (e) {
                        console.error(e);
                        this.notificar("Error de red al confirmar la actualización anual.", "error");
                    } finally {
                        this.guardando = false;
                    }
                },

                    if (!this.bienesActualizacionAnual || this.bienesActualizacionAnual.length === 0) {
                        this.notificar("El resguardante no tiene bienes en custodia para imprimir.", "error");
                        return;
                    }
                    const adaptados = this.bienesActualizacionAnual.map(b => ({
                        id: b.idArticulo,
                        numeroInventario: b.numeroInventario,
                        fechaResguardo: b.fechaAsignacion,
                        factura: b.facturaBien || 'S/F',
                        fechaFactura: b.fechaFacturaBien || '',
                        folioFiscalUuid: b.folioFiscalBien || 'S/F',
                        descripcion: b.descripcionBien || b.equipoMarca,
                        numeroSerie: b.equipoSerie || 'S/N',
                        marca: b.equipoMarca || 'S/M',
                        valorInicial: b.valorBien || 0,
                        fondoOrigen: b.fondoOrigen || 'INTERNO',
                        folioResguardo: b.folioResguardoOficial || ('2026 00001-CRE'),
                        boletaSalida: b.boletaSalidaBien || '',
                        centroTrabajo: this.formCTAnual.claveCT,
                        resguardanteActual: this.formDirectorAnual.nombre
                    }));
                    this.imprimirResguardoLoteMNREPINV(adaptados, {
                        director: this.formDirectorAnual,
                        ctInfo: this.formCTAnual
                    });
                },

                    const emp = empleado || this.empleadoSeleccionado || {};
                    const cctClave = emp.cct || (lista[0] && lista[0].cct) || '27DPR0001X';
                    const ctCatalogo = (this.centrosTrabajo || []).find(c => c.claveCT && c.claveCT.trim().toUpperCase() === cctClave.trim().toUpperCase()) || {};
                    const adaptados = lista.map(b => ({
                        id: b.idArticulo || b.idResguardo,
                        numeroInventario: b.numeroInventario || b.equipoSerie || ('RESG-' + b.idResguardo),
                        fechaResguardo: b.fechaAsignacion,
                        factura: b.facturaBien || 'S/F',
                        fechaFactura: b.fechaFacturaBien || '',
                        folioFiscalUuid: b.folioFiscalBien || 'S/F',
                        descripcion: b.descripcionBien || b.equipoMarca || 'BIEN MUEBLE INSTITUCIONAL',
                        numeroSerie: b.equipoSerie || 'S/N',
                        marca: b.equipoMarca || 'S/M',
                        valorInicial: b.valorBien || 0,
                        fondoOrigen: b.fondoOrigen || 'OFICIAL',
                        folioResguardo: b.folioResguardoOficial || ('RESG-' + b.idResguardo),

                        centroTrabajo: cctClave,

                    }));
                    this.imprimirResguardoLoteMNREPINV(adaptados, {

                get centrosFiltradosBase() {
                    const lista = this.centrosTrabajo || [];
                    if (!this.busquedaCT || !this.busquedaCT.trim()) return lista;
                    const b = this.busquedaCT.trim().toLowerCase();
                    return lista.filter(c =>
                        (c.claveCT && c.claveCT.toLowerCase().includes(b)) ||
                        (c.nombreCT && c.nombreCT.toLowerCase().includes(b)) ||
                        (c.municipio && c.municipio.toLowerCase().includes(b)) ||
                        (c.director && c.director.toLowerCase().includes(b))
                    );
                },

                get totalCTFiltrados() {
                    return this.centrosFiltradosBase.length;
                },

                get totalPaginasCT() {
                    const size = this.tamanoPaginaCT || 50;
                    return Math.max(1, Math.ceil(this.centrosFiltradosBase.length / size));
                },

                get centrosFiltrados() {
                    const base = this.centrosFiltradosBase;
                    const size = this.tamanoPaginaCT || 50;
                    const maxPag = Math.max(1, Math.ceil(base.length / size));
                    const pag = (this.paginaCTActual >= maxPag) ? 0 : this.paginaCTActual;
                    const start = pag * size;
                    return base.slice(start, start + size);
                },

                cambiarPaginaCT(nuevaPag) {
                    if (nuevaPag >= 0 && nuevaPag < this.totalPaginasCT) {
                        this.paginaCTActual = nuevaPag;
                    }
                },

                async cargarCentrosTrabajo(forzar = false) {
                    if (!forzar && Array.isArray(this.centrosTrabajo) && this.centrosTrabajo.length > 0) return;
                    this.cargandoAuxiliar = true;
                    try {
                        const respuesta = await fetch(`${SETAB_CONFIG.backendUrl}/api/centros-trabajo`, { method: 'GET', mode: 'cors', headers: { 'Authorization': `Bearer ${this.token}` } });
                        if (respuesta.ok) this.centrosTrabajo = await respuesta.json();
                    } catch (error) { console.error("Error al cargar CT"); } finally { this.cargandoAuxiliar = false; }
                },
                tabCatalogoActivo: 'proveedores',
                nombreCatalogoActivo: 'Proveedores',
                listaTabsCatalogos: [
                    { id: 'proveedores', nombre: 'Proveedores', icono: 'fas fa-truck' },
                    { id: 'tipos_articulos', nombre: 'Tipos de Artículos', icono: 'fas fa-boxes' },
                    { id: 'partidas', nombre: 'Partidas Presupuestales', icono: 'fas fa-file-invoice-dollar' },
                    { id: 'naturaleza_gasto', nombre: 'Naturaleza del Gasto', icono: 'fas fa-coins' },
                    { id: 'marcas', nombre: 'Marcas (MARCAS)', icono: 'fas fa-copyright' },
                    { id: 'tipos_folios', nombre: 'Tipos de Folios (TIPOFOL)', icono: 'fas fa-hashtag' },
                    { id: 'departamentos', nombre: 'Departamentos', icono: 'fas fa-building' },
                    { id: 'unidades', nombre: 'Unidades Responsables', icono: 'fas fa-sitemap' },
                    { id: 'subdirecciones', nombre: 'Subdirecciones', icono: 'fas fa-project-diagram' },
                    { id: 'giros', nombre: 'Giros de Proveedor', icono: 'fas fa-tags' },
                    { id: 'municipios', nombre: 'Municipios', icono: 'fas fa-map' },
                    { id: 'localidades', nombre: 'Localidades', icono: 'fas fa-location-arrow' },
                    { id: 'vialidades', nombre: 'Tipos de Vialidades', icono: 'fas fa-road' },
                    { id: 'asentamientos', nombre: 'Tipos de Asentamientos', icono: 'fas fa-map-marker-alt' }
                ],
                datosCatalogo: [],
                catalogosAuxiliares: [],
                catalogosMapa: {},
                busquedaCatalogo: '',
                modalCatalogoAbierto: false,
                itemCatalogo: { id: null, clave: '', descripcion: '', rfc: '', direccion: '', telefono: '', giro: '', partidaAsociada: '', subclave: '', cuentaContable: '' },

                catalogoPorTipo(tipo) {
                    const t = (tipo || '').toLowerCase();
                    if (this.catalogosMapa && Array.isArray(this.catalogosMapa[t])) {
                        return this.catalogosMapa[t];
                    }
                    if (!Array.isArray(this.catalogosAuxiliares)) return [];
                    return this.catalogosAuxiliares.filter(i => i && (i.tipoCatalogo || '').toLowerCase() === t);
                },

                catalogoPorTipoLimitado(tipo, limite = 100) {
                    const lista = this.catalogoPorTipo(tipo);
                    return Array.isArray(lista) ? lista.slice(0, limite) : [];
                },

                get centrosTrabajoLimitados() {
                    if (!Array.isArray(this.centrosTrabajo)) return [];
                    const termRaw = (this.nuevoArticulo?.centroTrabajo || this.articuloSeleccionado?.centroTrabajo || this.nuevoUsuario?.cct || '').trim().toLowerCase();
                    if (!termRaw) return this.centrosTrabajo.slice(0, 100);
                    return this.centrosTrabajo.filter(c =>
                        (c.claveCT && c.claveCT.toLowerCase().includes(termRaw)) ||
                        (c.nombreCT && c.nombreCT.toLowerCase().includes(termRaw))
                    ).slice(0, 100);
                },

                async cargarCatalogosAuxiliares(forzar = false) {
                    if (!forzar && Array.isArray(this.catalogosAuxiliares) && this.catalogosAuxiliares.length > 0) return;
                    try {
                        const respuesta = await fetch(`${SETAB_CONFIG.backendUrl}/api/catalogos/todos`, {
                            method: 'GET', mode: 'cors', headers: { 'Authorization': `Bearer ${this.token}` }
                        });
                        if (respuesta.ok) {
                            const lista = await respuesta.json();
                            this.catalogosAuxiliares = Array.isArray(lista) ? lista : [];
                            const mapa = {};
                            for (const item of this.catalogosAuxiliares) {
                                if (!item) continue;
                                const k = (item.tipoCatalogo || '').toLowerCase();
                                if (!mapa[k]) mapa[k] = [];
                                mapa[k].push(item);
                            }
                            this.catalogosMapa = mapa;
                        }
                    } catch (error) {
                        console.error("Error al cargar catálogos auxiliares:", error);
                    }
                },

                acCampoActivo: '',
                acModoActivo: 'alta',
                acSugerencias: [],
                acIndiceActivo: 0,
                acCargando: false,
                _acDebounceTimer: null,

                cerrarAutocompletadoBien() {
                    this.acCampoActivo = '';
                    this.acSugerencias = [];
                    this.acIndiceActivo = 0;
                    this.acCargando = false;
                },

                moverAutocompletadoBien(delta) {
                    if (!Array.isArray(this.acSugerencias) || this.acSugerencias.length === 0) return;
                    const total = this.acSugerencias.length;
                    this.acIndiceActivo = (this.acIndiceActivo + delta + total) % total;
                },

                confirmarEnterAutocompletadoBien(campo, modo = 'alta') {
                    if (this.acCampoActivo === campo && Array.isArray(this.acSugerencias) && this.acSugerencias.length > 0) {
                        const elegido = this.acSugerencias[this.acIndiceActivo] || this.acSugerencias[0];
                        if (elegido) {
                            this.seleccionarSugerenciaBien(elegido, campo, modo);
                        }
                    }
                },

                etiquetaPrincipalSugerencia(item, campo) {
                    if (!item) return '';
                    if (campo === 'centroTrabajo') {
                        return `${item.claveCT || ''} — ${item.nombreCT || ''}`.trim();
                    }
                    if (campo === 'resguardanteActual' || campo === 'resguardanteHistorico') {
                        return item.nombre || item.descripcion || '';
                    }
                    if (campo === 'proveedor') {
                        return item.nombre || item.descripcion || item.clave || '';
                    }
                    if (campo === 'marca' || campo === 'unidadResponsable' || campo === 'subdireccion' || campo === 'departamento' || campo === 'color' || campo === 'modelo') {
                        return item.descripcion || item.nombre || item.clave || '';
                    }
                    if (campo === 'tipoFolioResguardo') {
                        return item.clave || item.descripcion || '';
                    }
                    if (item.clave && item.descripcion && item.clave !== item.descripcion) {
                        return `${item.clave} — ${item.descripcion}`;
                    }
                    return item.descripcion || item.clave || item.nombre || '';
                },

                etiquetaSecundariaSugerencia(item, campo) {
                    if (!item) return '';
                    if (campo === 'tipoMaterial') {
                        const partes = [];
                        if (item.subclave) partes.push(`Sub: ${item.subclave}`);
                        if (item.partidaAsociada) partes.push(`Partida: ${item.partidaAsociada}`);
                        return partes.join(' | ') || 'TIPO';
                    }
                    if (campo === 'partida') {
                        return item.cuentaContable ? `Cta: ${item.cuentaContable}` : 'PARTIDA';
                    }
                    if (campo === 'proveedor') {
                        return item.rfc ? `RFC: ${item.rfc}` : (item.clave ? `Cve: ${item.clave}` : 'PROV');
                    }
                    if (campo === 'centroTrabajo') {
                        return item.director ? `Dir: ${item.director}` : (item.municipio || 'CCT');
                    }
                    if (campo === 'resguardanteActual' || campo === 'resguardanteHistorico') {
                        const partes = [];
                        if (item.rfc) partes.push(`RFC: ${item.rfc}`);
                        if (item.cct) partes.push(`CCT: ${item.cct}`);
                        return partes.join(' | ') || 'RESP';
                    }
                    if (campo === 'tipoFolioResguardo') {
                        return (item.descripcion && item.clave && item.descripcion !== item.clave) ? item.descripcion : 'FOLIO';
                    }
                    if (item.clave && campo !== 'color' && campo !== 'modelo') {
                        return `Cve: ${item.clave}`;
                    }
                    return '';
                },

                async abrirAutocompletadoBien(campo, valorActual = '', modo = 'alta') {
                    this.acCampoActivo = campo;
                    this.acModoActivo = modo;
                    this.acIndiceActivo = 0;
                    const q = String(valorActual || '').trim();
                    const qLower = q.toLowerCase();

                    const mapaCatalogoEndpoint = {
                        tipoMaterial: { tipo: 'tipos_articulos', limit: 50 },
                        partida: { tipo: 'partidas', limit: 50 },
                        naturalezaGasto: { tipo: 'naturaleza_gasto', limit: 50 },
                        marca: { tipo: 'marcas', limit: 50 },
                        proveedor: { tipo: 'proveedores', limit: 50 },
                        unidadResponsable: { tipo: 'unidades', limit: 50 },
                        subdireccion: { tipo: 'subdirecciones', limit: 50 },
                        departamento: { tipo: 'departamentos', limit: 50 },
                        tipoFolioResguardo: { tipo: 'tipos_folios', limit: 20 }
                    };

                    if (campo === 'centroTrabajo') {
                        const lista = Array.isArray(this.centrosTrabajo) ? this.centrosTrabajo : [];
                        if (!qLower) {
                            this.acSugerencias = lista.slice(0, 50);
                        } else {
                            const exactos = [];
                            const parciales = [];
                            for (const c of lista) {
                                if (!c) continue;
                                const cve = (c.claveCT || '').toLowerCase();
                                const nom = (c.nombreCT || '').toLowerCase();
                                const dir = (c.director || '').toLowerCase();
                                const mun = (c.municipio || '').toLowerCase();
                                if (cve.startsWith(qLower) || nom.startsWith(qLower)) {
                                    exactos.push(c);
                                    if (exactos.length >= 50) break;
                                } else if (cve.includes(qLower) || nom.includes(qLower) || dir.includes(qLower) || mun.includes(qLower)) {
                                    if (exactos.length + parciales.length < 50) parciales.push(c);
                                }
                            }
                            this.acSugerencias = exactos.concat(parciales).slice(0, 50);
                        }
                        return;
                    }

                    if (campo === 'color' || campo === 'modelo') {
                        const baseColores = campo === 'color'
                            ? ['BLANCO', 'NEGRO', 'GRIS', 'CAQUI', 'CAFE', 'PLATA', 'AZUL', 'GUINDA', 'BEIGE', 'VERDE', 'ROJO', 'AMARILLO', 'MADERA', 'CROMADO']
                            : ['S/M', 'ESTANDAR', 'EJECUTIVO', 'SECRETARIAL', 'INDUSTRIAL', 'LASERJET', 'THINKPAD', 'OPTIPLEX', 'LATITUDE', 'PROBOOK'];
                        const unicos = new Set(baseColores);
                        for (const a of (this.articulos || [])) {
                            const val = campo === 'color' ? a?.color : a?.modelo;
                            if (val && String(val).trim() !== '') {
                                unicos.add(String(val).trim().toUpperCase());
                            }
                            if (unicos.size >= 150) break;
                        }
                        const filtrados = Array.from(unicos)
                            .filter(v => !qLower || v.toLowerCase().includes(qLower))
                            .slice(0, 40)
                            .map(v => ({ clave: v, descripcion: v }));
                        this.acSugerencias = filtrados;
                        return;
                    }

                    if (campo === 'resguardanteActual' || campo === 'resguardanteHistorico') {
                        const locales = (this.empleados || []).filter(e => {
                            if (!e) return false;
                            if (!qLower) return true;
                            return (e.nombre && e.nombre.toLowerCase().includes(qLower)) ||
                                   (e.rfc && e.rfc.toLowerCase().includes(qLower)) ||
                                   (e.cct && e.cct.toLowerCase().includes(qLower));
                        }).slice(0, 50);
                        this.acSugerencias = locales;

                        if (q.length >= 2) {
                            if (this._acDebounceTimer) clearTimeout(this._acDebounceTimer);
                            this._acDebounceTimer = setTimeout(async () => {
                                if (this.acCampoActivo !== campo) return;
                                this.acCargando = true;
                                try {
                                    const resp = await fetch(`${SETAB_CONFIG.backendUrl}/api/empleados?busqueda=${encodeURIComponent(q)}&limit=50`, {
                                        method: 'GET', mode: 'cors', headers: { 'Authorization': `Bearer ${this.token}` }
                                    });
                                    if (resp.ok && this.acCampoActivo === campo) {
                                        const remotos = await resp.json();
                                        if (Array.isArray(remotos) && remotos.length > 0) {
                                            this.acSugerencias = remotos.slice(0, 50);
                                            this.acIndiceActivo = 0;
                                        }
                                    }
                                } catch (e) {
                                    console.error("Error autocompletando empleados:", e);
                                } finally {
                                    this.acCargando = false;
                                }
                            }, 160);
                        }
                        return;
                    }

                    const cfg = mapaCatalogoEndpoint[campo];
                    if (cfg) {
                        const cacheLocal = this.catalogoPorTipo(cfg.tipo) || [];
                        if (cacheLocal.length > 0) {
                            this.acSugerencias = cacheLocal.filter(i => {
                                if (!i) return false;
                                if (!qLower) return true;
                                return (i.clave && i.clave.toLowerCase().includes(qLower)) ||
                                       (i.descripcion && i.descripcion.toLowerCase().includes(qLower)) ||
                                       (i.nombre && i.nombre.toLowerCase().includes(qLower)) ||
                                       (i.rfc && i.rfc.toLowerCase().includes(qLower)) ||
                                       (i.subclave && i.subclave.toLowerCase().includes(qLower));
                            }).slice(0, cfg.limit);
                        }

                        if (this._acDebounceTimer) clearTimeout(this._acDebounceTimer);
                        this._acDebounceTimer = setTimeout(async () => {
                            if (this.acCampoActivo !== campo) return;
                            this.acCargando = true;
                            try {
                                const url = `${SETAB_CONFIG.backendUrl}/api/catalogos/${cfg.tipo}?q=${encodeURIComponent(q)}&limit=${cfg.limit}`;
                                const resp = await fetch(url, {
                                    method: 'GET', mode: 'cors', headers: { 'Authorization': `Bearer ${this.token}` }
                                });
                                if (resp.ok && this.acCampoActivo === campo) {
                                    const lista = await resp.json();
                                    if (Array.isArray(lista)) {
                                        this.acSugerencias = lista;
                                        this.acIndiceActivo = 0;
                                    }
                                }
                            } catch (e) {
                                console.error("Error en autocompletado de catálogo:", e);
                            } finally {
                                this.acCargando = false;
                            }
                        }, 140);
                    }
                },

                seleccionarSugerenciaBien(item, campo, modo = 'alta') {
                    if (!item) return;
                    const target = modo === 'edicion' ? this.articuloSeleccionado : this.nuevoArticulo;
                    if (!target) return;

                    if (campo === 'tipoMaterial') {
                        target.tipoMaterial = `${item.clave || ''} ${item.descripcion || ''}`.trim();
                        if (item.subclave && String(item.subclave).trim() !== '') {
                            target.subClave = String(item.subclave).trim();
                        }
                        if (item.partidaAsociada && String(item.partidaAsociada).trim() !== '') {
                            target.partida = String(item.partidaAsociada).trim();
                            const partCat = (this.catalogoPorTipo('partidas') || []).find(p =>
                                p && p.clave && p.clave.trim().toUpperCase() === target.partida.toUpperCase()
                            );
                            if (partCat && partCat.cuentaContable) {
                                target.cuentaContable = partCat.cuentaContable;
                            }
                        }
                        if (!target.descripcion || String(target.descripcion).trim() === '') {
                            target.descripcion = item.descripcion || '';
                        }
                    } else if (campo === 'partida') {
                        target.partida = item.clave || item.descripcion || '';
                        if (item.cuentaContable && String(item.cuentaContable).trim() !== '') {
                            target.cuentaContable = String(item.cuentaContable).trim();
                        }
                    } else if (campo === 'centroTrabajo') {
                        target.centroTrabajo = item.claveCT || item.clave || '';
                        if (item.unidadResponsable) target.unidadResponsable = item.unidadResponsable;
                        if (item.subdireccion) target.subdireccion = item.subdireccion;
                        if (item.departamento || item.zonaEscolar) {
                            target.departamento = item.departamento || item.zonaEscolar;
                        }
                        if (item.director && String(item.director).trim() !== '' && item.director !== 'SIN DIRECTOR ASIGNADO') {
                            target.resguardanteActual = String(item.director).trim();
                        }
                    } else if (campo === 'resguardanteActual') {
                        target.resguardanteActual = item.rfc ? `${item.nombre} (${item.rfc})` : (item.nombre || item.descripcion || '');
                        if (item.cct && item.cct !== 'SIN-CCT' && (!target.centroTrabajo || String(target.centroTrabajo).trim() === '')) {
                            target.centroTrabajo = item.cct;
                            const ctObj = (this.centrosTrabajo || []).find(c =>
                                c && c.claveCT && c.claveCT.trim().toUpperCase() === String(item.cct).trim().toUpperCase()
                            );
                            if (ctObj) {
                                if (ctObj.unidadResponsable && !target.unidadResponsable) target.unidadResponsable = ctObj.unidadResponsable;
                                if (ctObj.subdireccion && !target.subdireccion) target.subdireccion = ctObj.subdireccion;
                                if ((ctObj.departamento || ctObj.zonaEscolar) && !target.departamento) {
                                    target.departamento = ctObj.departamento || ctObj.zonaEscolar;
                                }
                            }
                        }
                    } else if (campo === 'resguardanteHistorico') {
                        target.resguardanteHistorico = item.rfc ? `${item.nombre} (${item.rfc})` : (item.nombre || item.descripcion || '');
                    } else if (campo === 'proveedor') {
                        target.proveedor = item.nombre || item.descripcion || item.clave || '';
                    } else if (campo === 'naturalezaGasto') {
                        target.naturalezaGasto = (item.clave && item.descripcion && item.clave !== item.descripcion)
                            ? `${item.clave} ${item.descripcion}`.trim()
                            : (item.descripcion || item.clave || '');
                    } else if (campo === 'marca') {
                        target.marca = item.descripcion || item.nombre || item.clave || '';
                    } else if (campo === 'tipoFolioResguardo') {
                        target.tipoFolioResguardo = item.clave || item.descripcion || '';
                    } else if (campo === 'unidadResponsable' || campo === 'subdireccion' || campo === 'departamento' || campo === 'color' || campo === 'modelo') {
                        target[campo] = item.descripcion || item.nombre || item.clave || '';
                    }

                    this.cerrarAutocompletadoBien();
                },

                autocompletarEscuelaPorCCT() {
                    if (!this.nuevoUsuario || !this.nuevoUsuario.cct) return;

                    if (!this.nuevoUsuario.username || this.nuevoUsuario.username.trim() === '' || this.nuevoUsuario.username.trim().toUpperCase() === clave.slice(0, -1)) {
                        this.nuevoUsuario.username = clave;
                    }
                    if (!this.nuevoUsuario.password || this.nuevoUsuario.password.trim() === '') {
                        this.nuevoUsuario.password = (this.nuevoUsuario.claveResponsable && this.nuevoUsuario.claveResponsable.trim() !== '')
                            ? this.nuevoUsuario.claveResponsable.trim().toUpperCase()
                            : clave;
                    }
                    if (!this.nuevoUsuario.email || this.nuevoUsuario.email.endsWith('@setab.gob.mx')) {
                        this.nuevoUsuario.email = `${clave.toLowerCase().replace(/[^a-z0-9]/g, '')}@setab.gob.mx`;
                    }
                    const ct = (this.centrosTrabajo || []).find(c => c && c.claveCT && c.claveCT.trim().toUpperCase() === clave);
                    if (ct && ct.nombreCT) {
                        this.nuevoUsuario.nombreEscuela = ct.nombreCT;

                get datosCatalogoFiltradosBase() {
                    const lista = this.datosCatalogo || [];
                    if (!this.busquedaCatalogo || !this.busquedaCatalogo.trim()) return lista;
                    const b = this.busquedaCatalogo.trim().toLowerCase();
                    return lista.filter(i =>

                        (i.descripcion && i.descripcion.toLowerCase().includes(b)) ||
                        (i.nombre && i.nombre.toLowerCase().includes(b)) ||
                        (i.rfc && i.rfc.toLowerCase().includes(b))
                    );

                get totalCatalogoFiltrados() {
                    return this.datosCatalogoFiltradosBase.length;

                get totalPaginasCatalogo() {
                    const size = this.tamanoPaginaCatalogo || 50;
                    return Math.max(1, Math.ceil(this.datosCatalogoFiltradosBase.length / size));
                },

                get datosCatalogoFiltrados() {
                    const base = this.datosCatalogoFiltradosBase;
                    const size = this.tamanoPaginaCatalogo || 50;
                    const maxPag = Math.max(1, Math.ceil(base.length / size));
                    const pag = (this.paginaCatalogoActual >= maxPag) ? 0 : this.paginaCatalogoActual;
                    const start = pag * size;
                    return base.slice(start, start + size);
                },

                cambiarPaginaCatalogo(nuevaPag) {
                    if (nuevaPag >= 0 && nuevaPag < this.totalPaginasCatalogo) {
                        this.paginaCatalogoActual = nuevaPag;

                async guardarItemCatalogo() {
                    this.guardando = true;
                    try {
                        const esEdicion = this.itemCatalogo.id !== null;
                        const url = esEdicion
                            ? `${SETAB_CONFIG.backendUrl}/api/catalogos/${this.tabCatalogoActivo}/${this.itemCatalogo.id}`
                            : `${SETAB_CONFIG.backendUrl}/api/catalogos/${this.tabCatalogoActivo}`;
                        const metodo = esEdicion ? 'PUT' : 'POST';

                        const payload = {
                            clave: this.itemCatalogo.clave,
                            descripcion: this.itemCatalogo.descripcion,
                            nombre: this.itemCatalogo.descripcion,
                            rfc: this.itemCatalogo.rfc || null,

                            subclave: this.itemCatalogo.subclave || null,
                            cuentaContable: this.itemCatalogo.cuentaContable || null
                        };

                        const respuesta = await fetch(url, {
                            method: metodo, mode: 'cors',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.token}` },
                            body: JSON.stringify(payload)
                        });

                        if (respuesta.ok) {
                            this.cerrarModalCatalogo();
                            this.cargarDatosCatalogoSelectivo();
                            this.cargarCatalogosAuxiliares(true);

                iniciarEscaner() {
                    this.resultadoEscaneo = null;
                    this.escanerEncendido = true;

                    setTimeout(() => {
                        if (this.html5QrcodeScanner) { this.html5QrcodeScanner.clear(); }
                        this.html5QrcodeScanner = new Html5Qrcode("qr-reader");

                        this.html5QrcodeScanner.start(
                            { facingMode: "environment" },
                            { fps: 10, qrbox: { width: 250, height: 250 } },
                            (textoDecodificado, result) => {
                                this.procesarLecturaQR(textoDecodificado);
                            },
                            (errorMensaje) => {
                            }
                        ).catch((err) => {
                            this.escanerEncendido = false;
                            this.notificar("No se pudo acceder a la cámara. Revisa permisos.", "error");
                        });
                    }, 300);
                },

                detenerEscaner() {
                    if (this.html5QrcodeScanner && this.escanerEncendido) {
                        this.html5QrcodeScanner.stop().then(() => {
                            this.html5QrcodeScanner.clear();
                            this.escanerEncendido = false;
                        }).catch(err => {
                            console.error("Error al detener", err);
                        });
                    }
                },

                procesarLecturaQR(textoQR) {
                    this.reproducirBeep();
                    this.detenerEscaner();
                    this.notificar("Código leído con éxito. Consultando base de datos en tiempo real...", "exito");
                    const raw = String(textoQR || '').trim();
                    const matchPipe = raw.match(/SETAB\|FOLIO:([^|]+)(?:\|TOKEN:(.*))?/i);
                    const matchFolioEtiqueta = raw.match(/FOLIO:\s*([A-Za-z0-9\-_]+)/i);
                    const matchFolioSEP = raw.match(/(SE-(?:AG|OF)-\d{2}-\d+)/i);
                    let folioExtraido = raw;
                    if (matchPipe && matchPipe[1]) {
                        folioExtraido = matchPipe[1].trim().toUpperCase();
                    } else if (matchFolioEtiqueta) {
                        folioExtraido = matchFolioEtiqueta[1].trim().toUpperCase();
                    } else if (matchFolioSEP) {
                        folioExtraido = matchFolioSEP[1].trim().toUpperCase();
                    }
                    this.buscarItemPorFolio(folioExtraido);
                },

                buscarFolioManual() {
                    if (!this.folioManual) return;
                    this.buscarItemPorFolio(this.folioManual.trim().toUpperCase());
                },

                async buscarItemPorFolio(folio) {
                    let encontrado = null;
                    try {
                        const resp = await fetch(`${SETAB_CONFIG.backendUrl}/api/bienes/folio/${encodeURIComponent(folio)}`, {
                            method: 'GET', mode: 'cors', headers: { 'Authorization': `Bearer ${this.token}` }
                        });
                        if (resp.ok) {
                            encontrado = await resp.json();
                        }
                    } catch (e) {
                        console.error("Error buscando folio en servidor:", e);
                    }

                    if (!encontrado) {
                        encontrado = this.articulos.find(a => a.numeroInventario === folio || String(a.id) === folio || a.tokenQR === folio);
                    }

                    if (encontrado) {
                        this.resultadoEscaneo = encontrado;
                        this.folioManual = '';
                    } else {
                        this.notificar("Equipo no encontrado en la base de datos", "error");
                        this.resultadoEscaneo = null;
                    }
                },

                reproducirBeep() {
                    try {
                        if (!this._audioCtx) {
                            this._audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        }
                        if (this._audioCtx.state === 'suspended') {
                            this._audioCtx.resume();
                        }
                        const oscillator = this._audioCtx.createOscillator();
                        oscillator.type = "sine";
                        oscillator.frequency.value = 800;
                        oscillator.connect(this._audioCtx.destination);
                        oscillator.start();
                        setTimeout(() => { try { oscillator.stop(); oscillator.disconnect(); } catch (err) {} }, 150);
                    } catch (e) { }
                },
                busquedaFolioHistorial: '',
                equipoAuditado: null,

                async buscarHistorialPorFolio() {
                    const folio = this.busquedaFolioHistorial.trim().toUpperCase();
                    if (!folio) {
                        this.notificar("Ingresa un folio o número de serie válido.", "error");

                    }

                    this.cargandoHistorial = true;
                    this.equipoAuditado = null;
                    this.historialArticulo = [];

                    try {
                        let equipo = this.articulos.find(a =>

                            });

                        if (!equipo) {

                                        (a.serie && a.serie.toUpperCase() === folio)

                                }
                            }
                        }

                        if (!equipo) {
                            this.notificar("Equipo no encontrado. Verifica el folio.", "error");
                            this.cargandoHistorial = false;
                            return;
                        }

                        this.equipoAuditado = equipo;

                        const respuesta = await fetch(`${SETAB_CONFIG.backendUrl}/api/trazabilidad/articulo/${equipo.id}`, {
                            method: 'GET', mode: 'cors', headers: { 'Authorization': `Bearer ${this.token}` }
                        });

                        if (respuesta.ok) {
                            this.historialArticulo = await respuesta.json();
