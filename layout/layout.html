                        }

                    } catch (error) {
                        this.notificar("Error de conexión al buscar historial.", "error");
                    } finally {
                        this.cargandoHistorial = false;
                    }
                },

                sesionExpiradaPorTiempo() {
                    const rawInicio = sessionStorage.getItem('inicioSesionSETAB') || localStorage.getItem('inicioSesionSETAB') || String(this.inicioSesion);
                    const ts = parseInt(rawInicio, 10);
                    if (isNaN(ts)) return false;
                    return (Date.now() - ts) >= this.duracionMaxSesionMs;
                },

                async renovarTokenKeycloak() {
                    if (this.sesionExpiradaPorTiempo()) {
                        this.cerrarSesion();
                        return false;
                    }
                    if (this._promesaRefresh) {
                        return this._promesaRefresh;
                    }
                    const currentRefresh = this.refreshToken || sessionStorage.getItem('refreshTokenSETAB') || localStorage.getItem('refreshTokenSETAB');
                    if (!currentRefresh) return false;

                    this._promesaRefresh = (async () => {
                        try {
                            const params = new URLSearchParams();
                            params.append('grant_type', 'refresh_token');
                            params.append('client_id', SETAB_CONFIG.clientId);
                            params.append('refresh_token', currentRefresh);

                            const nativeFetch = window.__originalSetabFetch || window.fetch.bind(window);
                            const resp = await nativeFetch(`${SETAB_CONFIG.keycloakUrl}/realms/${SETAB_CONFIG.realm}/protocol/openid-connect/token`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                                body: params.toString()
                            });

                            if (resp.ok) {
                                const data = await resp.json();
                                if (data.access_token) {
                                    this.token = data.access_token;
                                    sessionStorage.setItem('tokenSETAB', data.access_token);
                                    localStorage.setItem('tokenSETAB', data.access_token);
                                }
                                if (data.refresh_token) {
                                    this.refreshToken = data.refresh_token;
                                    sessionStorage.setItem('refreshTokenSETAB', data.refresh_token);
                                    localStorage.setItem('refreshTokenSETAB', data.refresh_token);
                                }
                                if (data.id_token) {
                                    sessionStorage.setItem('idTokenSETAB', data.id_token);
                                    localStorage.setItem('idTokenSETAB', data.id_token);
                                }
                                return true;
                            }
                        } catch (e) {
                            console.warn("Aviso al refrescar token en segundo plano:", e);
                        } finally {
                            this._promesaRefresh = null;
                        }
                        return false;
                    })();

                    return this._promesaRefresh;
                },

                init() {
                    if (!this.token || this.sesionExpiradaPorTiempo()) {
                        this.cerrarSesion();
                        return;
                    }

                    const self = this;
                    if (!window.__originalSetabFetch) {
                        window.__originalSetabFetch = window.fetch.bind(window);
                        window.fetch = async (input, initOpts = {}) => {
                            const urlStr = typeof input === 'string' ? input : (input instanceof URL ? input.toString() : (input.url || ''));
                            const esBackend = urlStr.startsWith(SETAB_CONFIG.backendUrl);

                            if (esBackend && initOpts && initOpts.headers && self.token) {
                                if (initOpts.headers instanceof Headers) {
                                    if (initOpts.headers.has('Authorization')) {
                                        initOpts.headers.set('Authorization', `Bearer ${self.token}`);
                                    }
                                } else if (typeof initOpts.headers === 'object' && initOpts.headers['Authorization']) {
                                    initOpts.headers['Authorization'] = `Bearer ${self.token}`;
                                }
                            }

                            let respuesta = await window.__originalSetabFetch(input, initOpts);
                            if (esBackend && respuesta.status === 401) {
                                if (self.sesionExpiradaPorTiempo()) {
                                    self.cerrarSesion();
                                    return respuesta;
                                }
                                const renovado = await self.renovarTokenKeycloak();
                                if (renovado && self.token) {
                                    const retryOpts = { ...initOpts, headers: { ...(initOpts.headers || {}), 'Authorization': `Bearer ${self.token}` } };
                                    respuesta = await window.__originalSetabFetch(input, retryOpts);
                                }
                            }
                            return respuesta;
                        };
                    }

                    setInterval(() => {
                        if (this.sesionExpiradaPorTiempo()) {
                            this.cerrarSesion();
                        } else {
                            this.renovarTokenKeycloak();
                        }
                    }, 210000);

                    document.addEventListener('visibilitychange', () => {
                        if (document.visibilityState === 'visible') {
                            if (this.sesionExpiradaPorTiempo()) {
                                this.cerrarSesion();
                            } else {
                                this.renovarTokenKeycloak();
                            }
                        }
                    });

                    window.addEventListener('focus', () => {
                        if (this.sesionExpiradaPorTiempo()) {
                            this.cerrarSesion();
                        } else {
                            this.renovarTokenKeycloak();
                        }
                    });

                    if (this.rolUsuario === 'SUPERADMIN') {
                        this.cambiarVista('catalogo', '../catalogo/catalogo.html');
                    } else if (this.rolUsuario === 'admin') {
                        this.cambiarVista('mi_escuela', '../catalogo/catalogo.html');
                        this.cargarPendientes();
                    }
                },

                async cambiarVista(nombreVista, rutaArchivo = null) {
                    if (this.vistaActiva === nombreVista && this.contenidoVista !== '' && nombreVista !== 'centros_trabajo') return;

                    if (this.vistaActiva === 'qr' && nombreVista !== 'qr') {
                        this.detenerEscaner();
                    }

                    if (nombreVista === 'catalogo' && this.articulos.length > 50) {
                        this.articulos = this.articulos.slice(0, 50);
                    }

                    this.vistaActiva = nombreVista;
                    if (nombreVista === 'resguardos' || nombreVista === 'solicitudes') {
                        this.vistaSubMenuActiva = nombreVista;
                    }

                    if (rutaArchivo && (rutaArchivo !== this.rutaArchivoActiva || this.contenidoVista === '')) {
                        if (this.cacheVistas[rutaArchivo]) {
                            this.contenidoVista = this.cacheVistas[rutaArchivo];
                            this.rutaArchivoActiva = rutaArchivo;
                            if (window.innerWidth < 1024) this.sidebarAbierto = false;
                        } else {
                            this.cargandoVista = true;
                            try {
                                const respuesta = await fetch(rutaArchivo);
                                if (respuesta.ok) {
                                    const html = await respuesta.text();
                                    this.cacheVistas[rutaArchivo] = html;
                                    this.contenidoVista = html;
                                    this.rutaArchivoActiva = rutaArchivo;
                                } else {
                                    this.contenidoVista = `<div class="bg-red-50 text-red-600 p-6 rounded-xl border border-red-200">Error al cargar ${rutaArchivo}</div>`;
                                }
                            } catch (error) {
                                console.error("Error SPA:", error);
                            } finally {
                                this.cargandoVista = false;
                                if (window.innerWidth < 1024) this.sidebarAbierto = false;
                            }
                        }
                    } else if (window.innerWidth < 1024) {
                        this.sidebarAbierto = false;
                    }

                    if (nombreVista === 'catalogo') { this.cargarArticulos(50); setTimeout(() => { this.cargarCatalogosAuxiliares(); this.cargarCentrosTrabajo(); }, 600); }
                    if (nombreVista === 'mi_escuela') { this.cargarMisEquipos(); this.cargarPendientes(); }
                    if (nombreVista === 'firmas') this.cargarPendientes();
                    if (nombreVista === 'usuarios') { this.cargarUsuarios(); if (this.empleados.length === 0) this.cargarEmpleados(); this.cargarCentrosTrabajo(); }
                    if (nombreVista === 'resguardos') { if (this.empleados.length === 0) { await this.cargarEmpleados(); } this.filtrarLocal(); }
                    if (nombreVista === 'solicitudes') { this.cargarSolicitudesBaja(); }
                    if (nombreVista === 'centros_trabajo') {
                        this.cargarCentrosTrabajo();
                        if (this.tabActualizarActivo === 'verificacion_anual') {
                            if (this.empleados.length === 0) this.cargarEmpleados();
                        }
                    }
                    if (nombreVista === 'catalogos_lista') this.cargarDatosCatalogoSelectivo();
                    if (nombreVista === 'qr') { this.cargarArticulos(100); this.cambiarTabQR('generar'); }
                    if (nombreVista === 'reportes') { this.cargarArticulos(5000); this.cargarSolicitudesBaja(); this.cargarCentrosTrabajo(); if (this.empleados.length === 0) this.cargarEmpleados(); }
                    if (nombreVista === 'historial') { this.busquedaFolioHistorial = ''; this.equipoAuditado = null; }
                },

                notificar(mensaje, tipo = 'exito') {
                    const id = Date.now();
                    this.toasts.push({ id, mensaje, tipo });
                    setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id); }, 4000);
                },

                get responsablesConAccesoBase() {
                    const usuariosList = Array.isArray(this.usuarios) ? this.usuarios : [];
                    const empleadosList = Array.isArray(this.empleados) ? this.empleados : [];
                    const mapPorCct = new Map();
                    const mapPorRfc = new Map();
                    const mapEmpPorCct = new Map();
                    const mapEmpPorId = new Map();

                    for (const emp of empleadosList) {
                        if (!emp) continue;
                        if (emp.id_empleado) mapEmpPorId.set(emp.id_empleado, emp);
                        if (emp.cct) {
                            const cUp = String(emp.cct).trim().toUpperCase();
                            if (cUp && cUp !== 'CENTRAL' && cUp !== 'SIN-CCT' && cUp !== 'S/C') {
                                mapEmpPorCct.set(cUp, emp);
                            }
                        }
                    }

                    for (const u of usuariosList) {
                        if (!u) continue;
                        if (u.cct) mapPorCct.set(String(u.cct).trim().toUpperCase(), u);
                        if (u.claveResponsable) mapPorRfc.set(String(u.claveResponsable).trim().toUpperCase(), u);
                        if (u.username) mapPorRfc.set(String(u.username).trim().toUpperCase(), u);
                    }

                    const combinados = [];
                    const idsUsuariosYaIncluidos = new Set();

                    for (const u of usuariosList) {
                        if (!u) continue;
                        idsUsuariosYaIncluidos.add(u.id);
                        const cctRaw = u.cct ? String(u.cct).trim().toUpperCase() : '';
                        const empVinc = (u.idEmpleado && mapEmpPorId.get(u.idEmpleado)) || (cctRaw && mapEmpPorCct.get(cctRaw)) || null;
                        const rfcLimpio = (empVinc && empVinc.rfc ? String(empVinc.rfc).trim().toUpperCase() : '')
                            || (u.claveResponsable ? String(u.claveResponsable).trim().toUpperCase() : '');
                        const usarCct = cctRaw && !cctRaw.startsWith('RESP-') && cctRaw !== 'CENTRAL' && cctRaw !== 'SIN-CCT' && cctRaw !== 'S/C';
                        const usernameEstandar = (u.username ? String(u.username).trim().toUpperCase() : '')
                            || (usarCct ? cctRaw : (rfcLimpio || 'CENTRAL'));
                        const passwordEstandar = (u.password && String(u.password).trim() !== '')
                            ? String(u.password).trim()
                            : (rfcLimpio || usernameEstandar);
                        const nombreFull = u.nombreCompleto || (empVinc && empVinc.nombre) || ((u.nombre || '') + ' ' + (u.apellidos || '')).trim() || usernameEstandar;

                        combinados.push({
                            uidKey: 'USR_' + u.id,
                            keyId: 'USR_' + u.id,
                            idUsuario: u.id,
                            idEmpleado: u.idEmpleado || (empVinc ? empVinc.id_empleado : null),
                            nombreCompleto: nombreFull,
                            nombre: nombreFull,
                            apellidos: u.apellidos || '',
                            username: usernameEstandar,
                            usernameWeb: usernameEstandar,
                            passwordAsignada: passwordEstandar,
                            email: u.email || '',
                            cct: cctRaw || 'CENTRAL',
                            nombreEscuela: u.nombreEscuela || (empVinc ? empVinc.nombreEscuela : '') || 'Oficinas Centrales SETAB',
                            nivelEducativo: u.nivelEducativo || (empVinc ? empVinc.area : '') || 'Educación Básica',
                            rol: u.rol || 'Admin',
                            activo: u.estado ? u.estado === 'Activo' : (u.activo !== false),
                            rfc: rfcLimpio || usernameEstandar,
                            curp: u.curp || (empVinc ? empVinc.curp : '') || '',
                            claveResponsable: rfcLimpio || usernameEstandar,
                            tieneCuentaWeb: true,
                            usuarioWeb: u,
                            usuarioWebObj: u
                        });
                    }

                    for (const emp of empleadosList) {
                        if (!emp) continue;
                        const cctUp = emp.cct ? String(emp.cct).trim().toUpperCase() : '';
                        const rfcUp = emp.rfc ? String(emp.rfc).trim().toUpperCase() : (emp.usuario ? String(emp.usuario).trim().toUpperCase() : '');
                        const usrMatch = (cctUp && mapPorCct.get(cctUp)) || (rfcUp && mapPorRfc.get(rfcUp));
                        if (usrMatch && idsUsuariosYaIncluidos.has(usrMatch.id)) {
                            continue;
                        }
                        const usarCct = cctUp && !cctUp.startsWith('RESP-') && cctUp !== 'CENTRAL' && cctUp !== 'SIN-CCT' && cctUp !== 'S/C';
                        const usernameEstandar = usrMatch && usrMatch.username
                            ? String(usrMatch.username).trim().toUpperCase()
                            : (usarCct ? cctUp : (rfcUp || ('DIR' + (emp.id_empleado || '1'))));
                        const passwordEstandar = (usrMatch && usrMatch.password)
                            ? String(usrMatch.password).trim()
                            : (rfcUp || usernameEstandar);
                        const nombreFull = emp.nombre || 'SIN NOMBRE';

                        combinados.push({
                            uidKey: 'EMP_' + emp.id_empleado,
                            keyId: 'EMP_' + emp.id_empleado,
                            idUsuario: usrMatch ? usrMatch.id : null,
                            idEmpleado: emp.id_empleado,
                            nombreCompleto: nombreFull,
                            nombre: nombreFull,
                            apellidos: '',
                            username: usernameEstandar,
                            usernameWeb: usernameEstandar,
                            passwordAsignada: passwordEstandar,
                            email: usrMatch ? usrMatch.email : '',
                            cct: cctUp || 'CENTRAL',
                            nombreEscuela: emp.nombreEscuela || 'Escuela / Unidad SETAB',
                            nivelEducativo: emp.area || 'Educación Básica',
                            rol: usrMatch ? usrMatch.rol : 'Admin',
                            activo: usrMatch ? (usrMatch.estado === 'Activo') : false,
                            rfc: rfcUp,
                            curp: emp.curp || '',
                            claveResponsable: rfcUp,
                            tieneCuentaWeb: !!usrMatch,
                            usuarioWeb: usrMatch || null,
                            usuarioWebObj: usrMatch || null
                        });
                    }

                    let filtrados = combinados;
                    if (this.filtroNivelUsuario !== '') {
                        filtrados = filtrados.filter(item => item.nivelEducativo === this.filtroNivelUsuario || (item.nivelEducativo && item.nivelEducativo.includes(this.filtroNivelUsuario)));
                    }
                    if (this.filtroRol === 'CON_ACCESO') {
                        filtrados = filtrados.filter(item => item.tieneCuentaWeb);
                    } else if (this.filtroRol === 'SIN_ACCESO') {
                        filtrados = filtrados.filter(item => !item.tieneCuentaWeb);
                    } else if (this.filtroRol !== '') {
                        filtrados = filtrados.filter(item => item.rol === this.filtroRol);
                    }
                    if (this.busquedaUsuario && this.busquedaUsuario.trim() !== '') {
                        const term = this.busquedaUsuario.trim().toLowerCase();
                        filtrados = filtrados.filter(item =>
                            (item.nombreCompleto && item.nombreCompleto.toLowerCase().includes(term)) ||
                            (item.usernameWeb && item.usernameWeb.toLowerCase().includes(term)) ||
                            (item.cct && item.cct.toLowerCase().includes(term)) ||
                            (item.nombreEscuela && item.nombreEscuela.toLowerCase().includes(term)) ||
                            (item.rfc && item.rfc.toLowerCase().includes(term)) ||
                            (item.curp && item.curp.toLowerCase().includes(term)) ||
                            (item.claveResponsable && item.claveResponsable.toLowerCase().includes(term))
                        );
                    }
                    return filtrados;
                },

                get totalResponsablesFiltrados() {
                    return this.responsablesConAccesoBase.length;
                },

                get totalPaginasResponsables() {
                    return Math.max(1, Math.ceil(this.responsablesConAccesoBase.length / 50));
                },

                get responsablesConAccesoFiltrados() {
                    const lista = this.responsablesConAccesoBase;
                    const maxPag = Math.max(1, Math.ceil(lista.length / 50));
                    if (this.paginaResponsablesActual >= maxPag) {
                        this.paginaResponsablesActual = 0;
                    }
                    const start = this.paginaResponsablesActual * 50;
                    return lista.slice(start, start + 50);
                },

                cambiarPaginaResponsables(nuevaPag) {
                    if (nuevaPag >= 0 && nuevaPag < this.totalPaginasResponsables) {
                        this.paginaResponsablesActual = nuevaPag;
                    }
                },

                habilitarAccesoDirectorDesdeResponsable(item) {
                    this.cargarCentrosTrabajo();
                    const partes = (item.nombreCompleto || item.nombre || '').trim().split(/\s+/);
                    const nombre = partes.slice(0, Math.max(1, Math.ceil(partes.length / 2))).join(' ');
                    const apellidos = partes.slice(Math.max(1, Math.ceil(partes.length / 2))).join(' ') || 'SETAB';
                    const cctLimpio = (item.cct && item.cct !== 'S/C') ? item.cct.trim().toUpperCase() : '';
                    const userStd = item.usernameWeb || ((cctLimpio && cctLimpio !== 'CENTRAL') ? cctLimpio : (item.rfc || ''));
                    const passStd = item.passwordAsignada || item.rfc || userStd;
                    this.nuevoUsuario = {
                        nombre: nombre,
                        apellidos: apellidos,
                        email: item.email || (userStd ? `${userStd.toLowerCase().replace(/[^a-z0-9]/g, '')}@setab.gob.mx` : ''),
                        username: userStd,
                        password: passStd,
                        cct: cctLimpio || userStd,
                        nivelEducativo: item.nivelEducativo || 'Primaria',
                        nombreEscuela: item.nombreEscuela || '',
                        rol: 'Admin',
                        curp: item.curp || '',
                        claveResponsable: item.rfc || item.claveResponsable || ''
                    };
                    this.modalRegistroUsuarioAbierto = true;
                },

                async activarDirectorRapidoKeycloak(item) {
                    if (!item) return;
                    this.guardando = true;
                    try {
                        const userStd = (item.usernameWeb || item.cct || item.rfc || '').trim().toUpperCase();
                        const passStd = (item.passwordAsignada || item.rfc || userStd).trim().toUpperCase();
                        const nombreFull = (item.nombre || item.nombreCompleto || userStd).trim().toUpperCase();
                        const payload = {
                            nombre: nombreFull,
                            apellidos: 'SETAB',
                            email: `${userStd.toLowerCase().replace(/[^a-z0-9]/g, '')}@setab.gob.mx`,
                            username: userStd,
                            password: passStd,
                            cct: (item.cct && item.cct !== 'S/C') ? item.cct.trim().toUpperCase() : userStd,
                            nivelEducativo: item.nivelEducativo || 'Educación Básica',
                            nombreEscuela: item.nombreEscuela || 'Centro Educativo SETAB',
                            rol: 'Admin',
                            curp: item.curp || '',
                            claveResponsable: item.rfc || item.claveResponsable || '',
                            keycloakUrl: SETAB_CONFIG.keycloakUrl,
                            realm: SETAB_CONFIG.realm
                        };
                        const respuesta = await fetch(`${SETAB_CONFIG.backendUrl}/api/usuarios`, {
                            method: 'POST',
                            mode: 'cors',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.token}` },
                            body: JSON.stringify(payload)
                        });
                        if (respuesta.ok) {
                            await this.cargarUsuarios();
                            this.notificar(`¡Acceso activado en Keycloak! Usuario: ${userStd} | Contraseña: ${passStd}`, "exito");
                        } else {
                            const err = await respuesta.json().catch(() => ({}));
                            this.notificar(err.error || "No fue posible sincronizar en Keycloak.", "error");
                        }
                    } catch (error) {
                        this.notificar("Error de conexión al activar acceso.", "error");
                    } finally {
                        this.guardando = false;
                    }
                },

                async cargarUsuarios() {
                    this.cargando = true;
                    try {
                        const respuesta = await fetch(`${SETAB_CONFIG.backendUrl}/api/usuarios`, { method: 'GET', mode: 'cors', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.token}` } });
                        if (respuesta.ok) this.usuarios = await respuesta.json();
                    } catch (error) { this.notificar("Error al cargar la lista de usuarios", "error"); } finally { this.cargando = false; }
                },

                async guardarNuevoUsuario() {
                    this.guardando = true;
                    try {
                        const payload = {
                            ...this.nuevoUsuario,
                            cct: this.nuevoUsuario.cct ? this.nuevoUsuario.cct.toUpperCase() : 'CENTRAL',
                            keycloakUrl: SETAB_CONFIG.keycloakUrl,
                            realm: SETAB_CONFIG.realm
                        };
                        const respuesta = await fetch(`${SETAB_CONFIG.backendUrl}/api/usuarios`, { method: 'POST', mode: 'cors', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.token}` }, body: JSON.stringify(payload) });
                        if (respuesta.ok) {
                            this.cerrarModalRegistroUsuario();
                            this.cargarUsuarios();
                            this.cargarEmpleados();
                            this.cargarCentrosTrabajo(true);
                            this.notificar("¡Director registrado y sincronizado!", "exito");
                        } else {
                            const err = await respuesta.json().catch(() => ({}));
                            this.notificar(err.error || "Error al crear usuario.", "error");
                        }
                    } catch (error) { this.notificar("Error de conexión al servidor.", "error"); } finally { this.guardando = false; }
                },

                abrirModalReset(usuario) { this.usuarioSeleccionado = usuario; this.nuevaPassword = ''; this.modalResetAbierto = true; },
                cerrarModalReset() { this.modalResetAbierto = false; setTimeout(() => { this.usuarioSeleccionado = {}; }, 300); },

                async guardarNuevaPassword() {
                    if (this.nuevaPassword.trim().length < 4) { this.notificar("La contraseña debe tener al menos 4 caracteres.", "error"); return; }
                    this.guardando = true;
                    try {
                        const payload = {
                            nuevaPassword: this.nuevaPassword.trim(),
                            keycloakUrl: SETAB_CONFIG.keycloakUrl,
                            realm: SETAB_CONFIG.realm
                        };
                        const respuesta = await fetch(`${SETAB_CONFIG.backendUrl}/api/usuarios/${this.usuarioSeleccionado.id}/reset-password`, { method: 'PUT', mode: 'cors', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.token}` }, body: JSON.stringify(payload) });
                        if (respuesta.ok) { this.notificar("¡Contraseña actualizada y sincronizada!", "exito"); this.cerrarModalReset(); }
                        else {
                            const err = await respuesta.json().catch(() => ({}));
                            this.notificar(err.error || "Error al intentar cambiar la contraseña.", "error");
                        }
                    } catch (error) { this.notificar("Fallo de conexión al servidor.", "error"); } finally { this.guardando = false; }
                },

                async cambiarEstado(idUsuario, nombreUser) {
                    if (!confirm(`¿Cambiar permisos de acceso para: ${nombreUser}?`)) return;
                    try {
                        const respuesta = await fetch(`${SETAB_CONFIG.backendUrl}/api/usuarios/${idUsuario}/toggle-estado`, { method: 'PUT', mode: 'cors', headers: { 'Authorization': `Bearer ${this.token}` } });
                        if (respuesta.ok) { this.cargarUsuarios(); this.notificar("Estado de la cuenta actualizado.", "exito"); }
                        else { this.notificar("Error al modificar el estado de la cuenta.", "error"); }
                    } catch (error) { this.notificar("Fallo de conexión.", "error"); }
                },

                filtrarLocal(resetPagina = true, desdeRemoto = false) {
                    if (resetPagina) {
                        this.paginaEmpleadosActual = 0;
                    }
                    let filtrados = this.empleados || [];
                    if (this.filtroNivel !== '') { filtrados = filtrados.filter(e => e.area === this.filtroNivel || (e.area && e.area.includes(this.filtroNivel))); }
                    if (this.filtroEmpleado !== '') {
                        const termino = this.filtroEmpleado.toLowerCase();
                        filtrados = filtrados.filter(e => (e.nombre && e.nombre.toLowerCase().includes(termino)) || (e.cct && e.cct.toLowerCase().includes(termino)) || (e.nombreEscuela && e.nombreEscuela.toLowerCase().includes(termino)) || (e.rfc && e.rfc.toLowerCase().includes(termino)) || (e.usuario && e.usuario.toLowerCase().includes(termino)) || (e.area && e.area.toLowerCase().includes(termino)));
                    }
                    const pageSize = 50;
                    this.totalEmpleadosFiltrados = filtrados.length;
                    this.totalPaginasEmpleados = Math.max(1, Math.ceil(filtrados.length / pageSize));
                    if (this.paginaEmpleadosActual >= this.totalPaginasEmpleados) {
                        this.paginaEmpleadosActual = 0;
                    }
                    const start = this.paginaEmpleadosActual * pageSize;
                    this.empleadosFiltrados = filtrados.slice(start, start + pageSize);

                    if (!desdeRemoto && this.filtroEmpleado && this.filtroEmpleado.trim().length >= 2 && filtrados.length < 15) {
                        clearTimeout(this._timerBusqEmp);
                        const termBusq = this.filtroEmpleado.trim();
                        this._timerBusqEmp = setTimeout(async () => {
                            try {
                                const resp = await fetch(`${SETAB_CONFIG.backendUrl}/api/empleados?busqueda=${encodeURIComponent(termBusq)}&limit=300`, {
                                    headers: { 'Authorization': `Bearer ${this.token}` }
                                });
                                if (resp.ok) {
                                    const remotos = await resp.json();
                                    if (Array.isArray(remotos) && remotos.length > 0) {
                                        const idsExistentes = new Set((this.empleados || []).map(x => x.id_empleado));
                                        for (const r of remotos) {
                                            if (r && !idsExistentes.has(r.id_empleado)) {
                                                this.empleados.push(r);
                                                idsExistentes.add(r.id_empleado);
                                            }
                                        }
                                        this.filtrarLocal(false, true);
                                    }
                                }
                            } catch (e) { }
                        }, 250);
                    }
                },

                cambiarPaginaEmpleados(nuevaPagina) {
                    if (nuevaPagina >= 0 && nuevaPagina < this.totalPaginasEmpleados) {
                        this.paginaEmpleadosActual = nuevaPagina;
                        this.filtrarLocal(false);
                    }
                },

                get empleadosFiltradosList() {
                    if (!this.busquedaEmpleado) return (this.empleados || []).slice(0, 80);
                    const busq = this.busquedaEmpleado.toLowerCase();
                    return (this.empleados || []).filter(e => (e.nombre && e.nombre.toLowerCase().includes(busq)) || (e.rfc && e.rfc.toLowerCase().includes(busq)) || (e.cct && e.cct.toLowerCase().includes(busq)) || (e.nombreEscuela && e.nombreEscuela.toLowerCase().includes(busq))).slice(0, 80);
                },

                get empleadosTraspasoFiltrados() {
                    const idSaliente = this.empleadoSeleccionado?.id_empleado;
                    const lista = (this.empleados || []).filter(e => e && e.id_empleado !== idSaliente);
                    if (!this.busquedaDirectorTraspaso || !this.busquedaDirectorTraspaso.trim()) {
                        return lista.slice(0, 80);
                    }
                    const busq = this.busquedaDirectorTraspaso.trim().toLowerCase();
                    return lista.filter(e =>
                        (e.nombre && e.nombre.toLowerCase().includes(busq)) ||
                        (e.rfc && e.rfc.toLowerCase().includes(busq)) ||
                        (e.cct && e.cct.toLowerCase().includes(busq)) ||
                        (e.usuario && e.usuario.toLowerCase().includes(busq)) ||
                        (e.nombreEscuela && e.nombreEscuela.toLowerCase().includes(busq))
                    ).slice(0, 80);
                },

                atenderSolicitud(solicitud) {
                    const empleadoEncontrado = this.empleados.find(e => e.id_empleado === solicitud.idEmpleado);
                    if (empleadoEncontrado) { this.abrirModalEquipos(empleadoEncontrado); }
                    else { this.notificar("El expediente de esta escuela no está disponible.", "error"); }
                },

                abrirModalEquipos(empleado) { this.empleadoSeleccionado = empleado; this.modalEquiposAbierto = true; this.cargarEquiposDelEmpleado(empleado.id_empleado); },
                cerrarModalEquipos() { this.modalEquiposAbierto = false; setTimeout(() => { this.empleadoSeleccionado = {}; this.equiposEmpleado = []; }, 300); },

                async cargarEquiposDelEmpleado(idEmpleado) {
                    this.cargandoEquipos = true; this.equiposEmpleado = [];
                    try {
                        const respuesta = await fetch(`${SETAB_CONFIG.backendUrl}/api/resguardos/empleado/${idEmpleado}`, { method: 'GET', mode: 'cors', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token } });
                        if (respuesta.ok) { this.equiposEmpleado = await respuesta.json(); }
                    } catch (error) { this.notificar("Error al obtener resguardos", "error"); } finally { this.cargandoEquipos = false; }
                },

                abrirModalAprobarBaja(equipo, desdeBandeja = false) {
                    this.equipoADevolver = equipo; this.vinoDesdeBandeja = desdeBandeja;
                    if (!desdeBandeja) { this.modalEquiposAbierto = false; }
                    this.modalAprobarBajaAbierto = true; this.initCanvas('canvas-firma-superadmin');
                },

                cerrarModalAprobarBaja() {
                    this.modalAprobarBajaAbierto = false; this.limpiarFirma('canvas-firma-superadmin');
                    if (!this.vinoDesdeBandeja) { this.modalEquiposAbierto = true; }
                },

                async procesarAprobacionBaja() {
                    if (this.isCanvasBlank(document.getElementById('canvas-firma-superadmin'))) { this.notificar("El Almacén Central debe firmar.", "error"); return; }
                    this.firmaBase64 = document.getElementById('canvas-firma-superadmin').toDataURL("image/png"); this.liberando = true;
                    try {

                initCanvas(canvasId = 'canvas-firma') {
                    setTimeout(() => {
                        this.canvas = document.getElementById(canvasId);
                        if (!this.canvas) return;
                        this.ctx = this.canvas.getContext('2d');
                        this.ctx.lineWidth = 3; this.ctx.lineCap = 'round'; this.ctx.strokeStyle = '#0f172a';
                        this.canvas.onmousedown = (e) => this.startDrawing(e);
                        this.canvas.onmousemove = (e) => this.draw(e);
                        this.canvas.onmouseup = () => this.stopDrawing();
                        this.canvas.onmouseout = () => this.stopDrawing();
                        this.canvas.ontouchstart = (e) => { e.preventDefault(); this.startDrawing(e.touches[0]); };
                        this.canvas.ontouchmove = (e) => { e.preventDefault(); this.draw(e.touches[0]); };
                        this.canvas.ontouchend = () => this.stopDrawing();
                    }, 300);
                },
                startDrawing(e) {
                    if (!this.canvas || !this.ctx || !e) return;
                    this.isDrawing = true;
                    const rect = this.canvas.getBoundingClientRect();
                    const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
                    const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, y);
                },
                draw(e) {
                    if (!this.isDrawing || !this.canvas || !this.ctx || !e) return;
                    const rect = this.canvas.getBoundingClientRect();
                    const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
                    const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
                    this.ctx.lineTo(x, y); this.ctx.stroke(); this.ctx.beginPath(); this.ctx.moveTo(x, y);
                },
                stopDrawing() { this.isDrawing = false; if (this.ctx) this.ctx.beginPath(); },
                limpiarFirma(canvasId = 'canvas-firma') {
                    const c = document.getElementById(canvasId);
                    if (c && c.getContext) { c.getContext('2d').clearRect(0, 0, c.width, c.height); }
                },
                isCanvasBlank(canvasEl) {
                    if (!canvasEl) return true;
                    const context = canvasEl.getContext('2d');
                    const pixelBuffer = new Uint32Array(context.getImageData(0, 0, canvasEl.width, canvasEl.height).data.buffer);
                    return !pixelBuffer.some(color => color !== 0);
                },

                async procesarFirmaDirector() {
                    if (this.isCanvasBlank(document.getElementById('canvas-firma-director'))) { this.notificar("Firma requerida", "error"); return; }
                    if (!this.datosResguardo.latitud || !this.datosResguardo.longitud) {
                        this.notificar("Debes capturar tu ubicación GPS obligatoria antes de firmar.", "error");
                        return;
                    }
                    this.guardando = true;
                    try {
                        const isBaja = this.pendienteSeleccionado.estadoResguardo === 'BAJA_EN_PROCESO';
                        const endpoint = isBaja ? `${SETAB_CONFIG.backendUrl}/api/resguardos/liberar/${this.pendienteSeleccionado.idResguardo}` : `${SETAB_CONFIG.backendUrl}/api/resguardos/firmar/${this.pendienteSeleccionado.idResguardo}`;
                        const payload = isBaja
                            ? { cantidad: this.pendienteSeleccionado.cantidadAsignada, firmaBase64: document.getElementById('canvas-firma-director').toDataURL("image/png"), latitudGPS: this.datosResguardo.latitud.toString(), longitudGPS: this.datosResguardo.longitud.toString() }
                            : { firmaBase64: document.getElementById('canvas-firma-director').toDataURL("image/png"), latitudGPS: this.datosResguardo.latitud.toString(), longitudGPS: this.datosResguardo.longitud.toString() };

                        const respuesta = await fetch(endpoint, { method: 'PUT', mode: 'cors', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.token}` }, body: JSON.stringify(payload) });
                        if (respuesta.ok) {
                            this.notificar("Autorizado", "exito");
                            this.descargarActa(this.pendienteSeleccionado.idResguardo, isBaja ? 'baja' : 'asignacion');
                            this.cerrarModalFirmaDirector(); this.cargarPendientes(); this.cargarMisEquipos();
                        } else {
                            const err = await respuesta.json().catch(() => ({}));
                            this.notificar(err.error || "Error al firmar", "error");
                        }
                    } catch (error) { this.notificar("Error de conexión", "error"); } finally { this.guardando = false; this.limpiarFirma('canvas-firma-director'); }
                },

                async descargarActa(idResguardo, tipoActa = 'asignacion') {
                    try {
                        this.notificar("Generando PDF...", "exito");
                        const endpoint = tipoActa === 'baja' ? 'pdf-baja' : 'pdf-asignacion';
                        const adminNameFront = encodeURIComponent(this.nombreUsuario);
                        const response = await fetch(`${SETAB_CONFIG.backendUrl}/api/resguardos/${endpoint}/${idResguardo}?adminName=${adminNameFront}`, { headers: { 'Authorization': `Bearer ${this.token}` } });
                        if (!response.ok) throw new Error('error');
                        const blob = await response.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `Acta_${tipoActa.toUpperCase()}_SETAB_Folio_${idResguardo}.pdf`;
                        document.body.appendChild(a); a.click(); a.remove();
                    } catch (error) { this.notificar("Error al descargar", "error"); }
                },

                formatearFecha(fechaArray) {
                    if (!fechaArray) return 'Fecha desconocida';
                    if (Array.isArray(fechaArray)) {
                        const [yyyy, mm, dd, hh, min] = fechaArray;
                        return `${dd}/${mm}/${yyyy} a las ${hh}:${min < 10 ? '0' + min : min}`;
                    }
                    const f = new Date(fechaArray);
                    return isNaN(f.getTime()) ? fechaArray : f.toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' });
                },

                cerrarSesion() {
                    const idToken = sessionStorage.getItem('idTokenSETAB') || localStorage.getItem('idTokenSETAB');
                    sessionStorage.clear();
                    ['tokenSETAB', 'refreshTokenSETAB', 'idTokenSETAB', 'rolSETAB', 'nombreSETAB', 'inicioSesionSETAB'].forEach(k => localStorage.removeItem(k));
                    const baseUrl = window.location.origin;
                    if (!idToken) { window.location.href = '../login/index.html'; return; }
                    const logoutUrl = `${SETAB_CONFIG.keycloakUrl}/realms/${SETAB_CONFIG.realm}/protocol/openid-connect/logout?client_id=${SETAB_CONFIG.clientId}&post_logout_redirect_uri=${encodeURIComponent(baseUrl + '/login/index.html')}&id_token_hint=${idToken}`;
                    window.location.href = logoutUrl;
                },
                abrirModalTraspaso(empleado) {
                    this.empleadoSeleccionado = empleado;
                    this.idDirectorEntrante = '';
                    this.busquedaDirectorTraspaso = '';
                    this.procesandoTraspaso = false;
                    this.modalTraspasoAbierto = true;
                    this.initCanvas('canvas-firma-traspaso');
                },

                cerrarModalTraspaso() {
                    this.modalTraspasoAbierto = false;
                    this.limpiarFirma('canvas-firma-traspaso');
                    setTimeout(() => {
                        this.empleadoSeleccionado = {};
                        this.idDirectorEntrante = '';
                        this.busquedaDirectorTraspaso = '';
                    }, 300);
                },

                async procesarTraspaso() {
                    if (!this.idDirectorEntrante) {
                        this.notificar("Selecciona al Director Entrante", "error");
                        return;
                    }
                    if (this.isCanvasBlank(document.getElementById('canvas-firma-traspaso'))) {
                        this.notificar("El Director Saliente debe firmar", "error");
                        return;
                    }

                    this.procesandoTraspaso = true;
                    const firmaSaliente = document.getElementById('canvas-firma-traspaso').toDataURL("image/png");
                    const idEntrante = parseInt(this.idDirectorEntrante);

                    try {
                        const payload = {
                            idEmpleadoSaliente: this.empleadoSeleccionado.id_empleado,
                            idEmpleadoEntrante: idEntrante,
                            cct: this.empleadoSeleccionado.cct,
                            firmaSalienteBase64: firmaSaliente
                        };

                        const respuesta = await fetch(`${SETAB_CONFIG.backendUrl}/api/traspasos`, {
                            method: 'POST',
                            mode: 'cors',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.token}`
                            },
                            body: JSON.stringify(payload)
                        });

                        if (respuesta.ok) {
                            this.notificar("¡Traspaso ejecutado! Generando Acta de Entrega-Recepción...", "exito");
                            await this.imprimirActaTraspaso(idEntrante);
                            this.cerrarModalTraspaso();
                            this.cargarEmpleados();
                        } else {
                            const err = await respuesta.json().catch(() => ({}));
                            this.notificar(err.error || "Error en el traspaso", "error");
                        }
                    } catch (e) {
                        this.notificar("Error de conexión al servidor", "error");
                    } finally {
                        this.procesandoTraspaso = false;
                    }
                },

                async imprimirActaTraspaso(idEmpleadoTarget) {
                    try {
                        const resp = await fetch(`${SETAB_CONFIG.backendUrl}/api/traspasos/acta/${encodeURIComponent(idEmpleadoTarget)}`, {
                            headers: { 'Authorization': `Bearer ${this.token}` }
                        });
                        if (!resp.ok) return;
                        const acta = await resp.json();
                        const ventana = window.open('', '_blank', 'width=950,height=800');
                        const filas = (acta.bienesTraspasados || []).map(r => `
                            <tr>
                                <td style="border:1px solid #cbd5e1;padding:6px;font-family:monospace;">${r.articulo?.numeroInventario || 'S/N'}</td>
                                <td style="border:1px solid #cbd5e1;padding:6px;">${r.articulo?.descripcion || r.articulo?.marca || 'Equipo'}</td>
                                <td style="border:1px solid #cbd5e1;padding:6px;font-family:monospace;">${r.articulo?.numeroSerie || 'S/N'}</td>
                                <td style="border:1px solid #cbd5e1;padding:6px;text-align:center;">${r.cantidadAsignada || 1}</td>
                            </tr>
                        `).join('');

                        ventana.document.write(`
                            <html>
                            <head>
                                <title>Acta de Traspaso y Actualización CCT ${acta.cct}</title>
                                <style>
                                    body { font-family: Arial, sans-serif; padding: 30px; color: #1e293b; font-size: 12px; line-height: 1.5; }
                                    h1 { color: #981A35; font-size: 18px; margin-bottom: 4px; }
                                    table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 11px; }
                                    th { background: #981A35; color: #fff; padding: 7px; text-align: left; }
                                    .firmas { margin-top: 50px; display: flex; justify-content: space-between; text-align: center; }
                                    .caja-firma { width: 42%; border-top: 1px solid #000; padding-top: 8px; }
                                </style>
                            </head>
                            <body>
                                <h1>SECRETARÍA DE EDUCACIÓN DEL ESTADO DE TABASCO</h1>
                                <p><strong>ACTA DE ENTREGA-RECEPCIÓN Y ACTUALIZACIÓN DE RESGUARDO POR ROTACIÓN DE DIRECTOR</strong></p>
                                <p><strong>Clave CCT:</strong> ${acta.cct} | <strong>Centro de Trabajo:</strong> ${acta.nombreEscuela || 'S/N'} | <strong>Fecha:</strong> ${acta.fechaTraspaso}</p>
                                <p>Por medio de la presente se hace constar la transferencia de custodia y actualización de los bienes muebles propiedad de la SETAB asignados al Centro de Trabajo <strong>${acta.cct}</strong>, entregando el <strong>C. ${acta.directorSaliente}</strong> y recibiendo de conformidad el responsable <strong>C. ${acta.directorEntrante}</strong>, sin que ello implique baja del inventario central.</p>
                                <table>
                                    <thead>
                                        <tr><th>Folio Inventario</th><th>Descripción del Bien</th><th>No. Serie</th><th>Cantidad</th></tr>
                                    </thead>
                                    <tbody>${filas}</tbody>
                                </table>
                                <div class="firmas">
                                    <div class="caja-firma">
                                        ${acta.firmaSalienteBase64 ? `<img src="${acta.firmaSalienteBase64}" style="height:60px;display:block;margin:0 auto 5px auto;">` : '<div style="height:65px;"></div>'}
                                        <strong>ENTREGA (DIRECTOR SALIENTE)</strong><br>${acta.directorSaliente}
                                    </div>
                                    <div class="caja-firma">
                                        <div style="height:65px;"></div>
                                        <strong>RECIBE (DIRECTOR ENTRANTE)</strong><br>${acta.directorEntrante}
                                    </div>
                                </div>
                            </body>
                            </html>
                        `);
                        ventana.document.close();
                        setTimeout(() => { ventana.print(); }, 400);
                    } catch (e) {
                        console.error(e);
                    }
                },
                abrirModalQR(articulo) {
                    this.articuloSeleccionado = articulo;
                    this.modalQRAbierto = true;
                    this.$nextTick(() => {
                        const container = document.getElementById('qr-container') || document.getElementById('qr-container-vista');
                        if (!container) return;
                        container.innerHTML = '';
                        new QRCode(container, {
                            text: this.generarTextoQRArticulo(articulo),
                            width: 200,
                            height: 200,
                            colorDark: "#981A35",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.M
                        });
                    });
                },
                imprimirEtiquetaIndividual(articulo) {
                    if (!articulo || !articulo.id) return;
                    const previos = Array.isArray(this.itemsSeleccionadosQR) ? [...this.itemsSeleccionadosQR] : [];
                    const existeEnLista = this.articulos.some(a => a && a.id === articulo.id);
                    if (!existeEnLista) {
                        this.articulos.push(articulo);
                    }
                    this.itemsSeleccionadosQR = [articulo.id];
                    this.imprimirEtiquetasSeleccionadas();
                    this.itemsSeleccionadosQR = previos;
                },
                cerrarModalQR() {
                    this.modalQRAbierto = false;
                }
            }
        }
    </script>
</body>

</html>
