<!DOCTYPE html>
<html lang="es" x-data="{ temaOscuro: localStorage.getItem('tema') === 'dark' }"
    x-init="$watch('temaOscuro', val => localStorage.setItem('tema', val ? 'dark' : 'light'))"
    :class="{ 'dark': temaOscuro }">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Central - INVENTARIOS SETAB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../rutas/config.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        guinda: { DEFAULT: '#981A35', dark: '#691C32' },
                        dorado: { DEFAULT: '#BC955C' },
                        caqui: { DEFAULT: '#F3F0E5', dark: '#E5DFD1' }
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        [x-cloak] {
            display: none !important;
        }

        select[size] {
            height: auto;
            max-height: 150px;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .canvas-firma {
            border: 2px dashed #cbd5e1;
            border-radius: 0.5rem;
            background-color: #f8fafc;
            cursor: crosshair;
            touch-action: none;
        }

        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap');

        *,
        html,
        body,
        p,
        div,
        span,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        input,
        button,
        select,
        table {
            font-family: 'Montserrat', sans-serif !important;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800" x-data="layoutMaestro()">

        <div x-show="sidebarAbierto" x-cloak class="fixed inset-0 z-40 bg-gray-900/50 lg:hidden"

        <aside :class="sidebarAbierto ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"

                <img src="../img/BANNER_LOGO.png" alt="Logo SETAB"

            </div>
            <div class="mt-1 mx-4 pb-2.5 border-b border-dorado/30 text-center">

                    x-text="rolUsuario === 'SUPERADMIN' ? 'Almacén Central' : 'Director Escolar'"></p>
                <p class="text-xs font-bold text-guinda truncate" x-text="nombreUsuario"></p>
            </div>
            <ul class="space-y-2 mt-3 px-3 flex-1 overflow-y-auto custom-scrollbar pb-4"
                x-data="{ menuAbierto: 'archivos' }">
                <template x-if="rolUsuario === 'SUPERADMIN'">
                    <div class="space-y-2">
                        <li class="rounded-lg overflow-hidden border transition-colors duration-300"
                            :class="menuAbierto === 'archivos' ? 'bg-white border-guinda shadow-sm' : 'bg-white/40 border-dorado/20'">
                            <button @click="menuAbierto = menuAbierto === 'archivos' ? '' : 'archivos'"
                                class="w-full flex items-center justify-between p-3 transition-colors font-bold"
                                :class="menuAbierto === 'archivos' ? 'text-guinda' : 'text-gray-800 hover:bg-white/60'">
                                <div class="flex items-center gap-3">
                                    <i class="fas fa-folder-open w-5"
                                        :class="menuAbierto === 'archivos' ? 'text-guinda' : 'text-dorado'"></i>
                                    Archivos
                                </div>
                                <i class="fas fa-chevron-down transition-transform duration-300"
                                    :class="menuAbierto === 'archivos' ? 'rotate-180 text-guinda' : 'text-gray-400'"></i>
                            </button>
                            <ul x-show="menuAbierto === 'archivos'" x-collapse
                                class="bg-white/50 px-2 py-2 space-y-1 text-sm border-t border-gray-100">
                                <li><a href="#" @click.prevent="cambiarVista('catalogo', '../catalogo/catalogo.html')"
                                        class="block p-2 rounded transition-colors"
                                        :class="vistaActiva === 'catalogo' ? 'bg-guinda text-white shadow-sm' : 'hover:bg-guinda hover:text-white'">Catálogo

                                <li><a href="#" @click.prevent="cambiarVista('resguardos', '../personal/personal.html')"
                                        class="block p-2 rounded transition-colors"
                                        :class="vistaActiva === 'resguardos' ? 'bg-guinda text-white shadow-sm' : 'hover:bg-guinda hover:text-white'">Gestor
                                        de Resguardos</a></li>
                                <li><a href="#"
                                        @click.prevent="cambiarVista('solicitudes', '../personal/personal.html')"
                                        class="flex justify-between p-2 rounded transition-colors"
                                        :class="vistaActiva === 'solicitudes' ? 'bg-guinda text-white shadow-sm' : 'hover:bg-guinda hover:text-white'">Trámite
                                        de Bajas

                                            x-text="solicitudesBaja.length"></span></a></li>

                        </li>

                        <li class="rounded-lg overflow-hidden border transition-colors duration-300"

                            <button @click="menuAbierto = menuAbierto === 'actualizar' ? '' : 'actualizar'"

                                <li><a href="#"

                                </li>
                                <li><a href="#"
                                        @click.prevent="cambiarVista('centros_trabajo', '../actualizar/actualizar.html')"
                                        class="block p-2 rounded transition-colors"

                                        de Trabajo</a></li>
                                <li><a href="#" @click.prevent="cambiarVista('usuarios', '../usuarios/usuarios.html')"

                        <li class="rounded-lg overflow-hidden border transition-colors duration-300"
                            :class="menuAbierto === 'reportes' ? 'bg-white border-guinda shadow-sm' : 'bg-white/40 border-dorado/20'">
                            <button @click="menuAbierto = menuAbierto === 'reportes' ? '' : 'reportes'"

                                :class="menuAbierto === 'reportes' ? 'text-guinda' : 'text-gray-800 hover:bg-white/60'">
                                <div class="flex items-center gap-3">

                                <i class="fas fa-chevron-down transition-transform duration-300"

                            </button>
                            <ul x-show="menuAbierto === 'reportes'" x-collapse
                                class="bg-white/50 px-2 py-2 space-y-1 text-sm border-t border-gray-100">
                                <li><a href="#" @click.prevent="cambiarVista('reportes', '../reportes/reportes.html')"
                                        class="block p-2 rounded transition-colors"
                                        :class="vistaActiva === 'reportes' ? 'bg-guinda text-white shadow-sm' : 'hover:bg-guinda hover:text-white'">Reportes
                                        Semestrales</a></li>
                            </ul>
                        </li>

                        <li class="rounded-lg overflow-hidden border transition-colors duration-300"
                            :class="menuAbierto === 'utilerias' ? 'bg-white border-guinda shadow-sm' : 'bg-white/40 border-dorado/20'">
                            <button @click="menuAbierto = menuAbierto === 'utilerias' ? '' : 'utilerias'"
                                class="w-full flex items-center justify-between p-3 transition-colors font-bold"
                                :class="menuAbierto === 'utilerias' ? 'text-guinda' : 'text-gray-800 hover:bg-white/60'">
                                <div class="flex items-center gap-3">
                                    <i class="fas fa-tools w-5"
                                        :class="menuAbierto === 'utilerias' ? 'text-guinda' : 'text-dorado'"></i>
                                    Utilerías
                                </div>
                                <i class="fas fa-chevron-down transition-transform duration-300"
                                    :class="menuAbierto === 'utilerias' ? 'rotate-180 text-guinda' : 'text-gray-400'"></i>
                            </button>
                            <ul x-show="menuAbierto === 'utilerias'" x-collapse
                                class="bg-white/50 px-2 py-2 space-y-1 text-sm border-t border-gray-100">
                                <li><a href="#" @click.prevent="cambiarVista('qr', '../qr/qr.html')"
                                        class="block p-2 rounded transition-colors"
                                        :class="vistaActiva === 'qr' ? 'bg-guinda text-white shadow-sm' : 'hover:bg-guinda hover:text-white'">Control
                                        QR</a></li>
                                <li><a href="#" @click.prevent="cambiarVista('historial', '../historial/historial.html')"
                                        class="block p-2 rounded transition-colors"
                                        :class="vistaActiva === 'historial' ? 'bg-guinda text-white shadow-sm' : 'hover:bg-guinda hover:text-white'">Trazabilidad /
                                        Historial</a></li>
                            </ul>
                        </li>
                    </div>
                </template>
                <template x-if="rolUsuario === 'admin'">
                    <div class="space-y-2 mt-2">
                        <li class="bg-white/40 rounded-lg overflow-hidden border border-dorado/20">
                            <a href="#" @click.prevent="cambiarVista('mi_escuela', '../catalogo/catalogo.html')"
                                class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm transition-colors"
                                :class="vistaActiva === 'mi_escuela' ? 'bg-guinda text-white shadow-sm' : 'text-gray-700 hover:bg-white/60 hover:text-guinda font-bold'">
                                <i class="fas fa-school w-5 text-center text-dorado"></i> Mi Escuela (Bienes)
                            </a>
                        </li>
                        <li class="bg-white/40 rounded-lg overflow-hidden border border-dorado/20">
                            <a href="#" @click.prevent="cambiarVista('firmas', '../catalogo/catalogo.html')"
                                class="flex items-center justify-between rounded-lg px-4 py-3 text-sm transition-colors"
                                :class="vistaActiva === 'firmas' ? 'bg-guinda text-white shadow-sm' : 'text-gray-700 hover:bg-white/60 hover:text-guinda font-bold'">
                                <div class="flex items-center gap-3"><i
                                        class="fas fa-file-signature w-5 text-center text-dorado"></i> Bandeja de Firmas
                                </div>
                                <span x-show="pendientes.length > 0"
                                    class="bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full shadow-sm"
                                    x-text="pendientes.length"></span>
                            </a>
                        </li>
                    </div>
                </template>
            </ul>
            <div class="sticky inset-x-0 bottom-0 bg-guinda px-4 py-3 border-t border-guinda-dark">
                <div class="flex justify-center mb-2.5"><img
                        src="https://tabasco.gob.mx/sites/default/files/inline-images/Logo_Cacao_Footer.png"
                        alt="Gobierno de Tabasco"
                        class="h-10 object-contain opacity-90 hover:opacity-100 transition-opacity"></div>
                <button @click="cerrarSesion()"
                    class="flex items-center justify-center gap-2 bg-white/10 py-2 px-3 hover:bg-white/20 w-full rounded-lg text-white font-medium text-xs transition-all focus:ring-2 focus:ring-white/50"><i
                        class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
            </div>
        </aside>

        <div class="flex-1 flex flex-col overflow-y-auto lg:ml-64 w-full custom-scrollbar relative">
            <header
                class="bg-white border-b border-gray-200 lg:hidden flex items-center justify-between p-4 sticky top-0 z-30">
                <button @click="sidebarAbierto = true" class="p-2 bg-gray-100 rounded text-gray-600"><i
                        class="fas fa-bars"></i></button>
                <span class="font-bold text-guinda"
                    x-text="rolUsuario === 'SUPERADMIN' ? 'INVENTARIO CENTRAL' : 'SISTEMA DIRECTORES'"></span>
            </header>
            <main class="p-6 md:p-8 w-full h-full relative overflow-y-auto">
                <div x-show="cargandoVista" x-cloak
                    class="absolute inset-0 bg-gray-50 flex flex-col items-center justify-center z-10">
                    <svg class="animate-spin h-10 w-10 text-guinda mb-4" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    <p class="text-gray-500 font-medium">Cargando módulo...</p>
                </div>
                <div x-html="contenidoVista"></div>
            </main>
        </div>
    </div>

    <div class="fixed bottom-5 right-5 z-[60] flex flex-col gap-3 pointer-events-none">
        <template x-for="toast in toasts" :key="toast.id">
            <div x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="opacity-0 translate-y-4 scale-95"
                x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 scale-100"
                x-transition:leave-end="opacity-0 scale-95"
                class="flex items-center gap-3 p-4 rounded-xl shadow-2xl text-white text-sm font-bold min-w-[250px] max-w-sm"
                :class="toast.tipo === 'exito' ? 'bg-green-600 border border-green-500' : 'bg-red-600 border border-red-500'">
                <svg x-show="toast.tipo === 'exito'" class="w-6 h-6 shrink-0" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <svg x-show="toast.tipo === 'error'" class="w-6 h-6 shrink-0" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span x-text="toast.mensaje"></span>
            </div>
        </template>
    </div>

    <script>
        function layoutMaestro() {
            const rawRol = sessionStorage.getItem('rolSETAB') ? sessionStorage.getItem('rolSETAB').replace(/['"]+/g, '').trim() : '';
            const rolNormalizado = rawRol.toUpperCase() === 'SUPERADMIN' ? 'SUPERADMIN' : (rawRol.toLowerCase() === 'admin' ? 'admin' : rawRol);

            return {
                sidebarAbierto: false,
                token: sessionStorage.getItem('tokenSETAB') ? sessionStorage.getItem('tokenSETAB').replace(/['"]+/g, '') : null,
                refreshToken: sessionStorage.getItem('refreshTokenSETAB') ? sessionStorage.getItem('refreshTokenSETAB').replace(/['"]+/g, '') : null,
                rolUsuario: rolNormalizado,
                nombreUsuario: sessionStorage.getItem('nombreSETAB') || 'Usuario',

                vistaActiva: '',
                vistaSubMenuActiva: 'resguardos',
                contenidoVista: '',
                cargandoVista: false,

                toasts: [],
                cargando: false,
                guardando: false,
                errorMensaje: '',

                articulos: [], totalRegistros: 0,
                filtroBusqueda: '', filtroCategoria: '', filtroArea: '', paginaActual: 0, totalPaginas: 1,
                misEquipos: [], pendientes: [], pendienteSeleccionado: {},

                modalAbierto: false, modalRegistroAbierto: false, modalResguardoAbierto: false,
                modalConfirmacionAbierto: false, modalHistorialAbierto: false, modalFirmaDirectorAbierto: false,
                modalSeguridadAbierto: false, textoConfirmacion: '', idBajaPendiente: null, modalTraspasoAbierto: false, idDirectorEntrante: '', procesandoTraspaso: false, empleadosGeneral: [],

                articuloSeleccionado: {},
                nuevoArticulo: {
                    numeroInventario: '', tipoMaterial: '', subClave: '', categoria: '', areaUbicacion: '', descripcion: '',
                    marca: '', modelo: '', serie: '', numeroSerie: '', color: '', estadoFisico: 'NUEVO', estado: 'Activo',
                    proveedor: '', factura: '', fechaFactura: null,
                    precioSinIva: null, precio: null, valorInicial: null,
                    pedido: '', requisicion: '', naturalezaGasto: '', partida: '',
                    motor: '', placa: '', poliza: '', vigenciaPoliza: null,
                    centroTrabajo: '', responsable: '', boletaSalida: '', cantidadStock: 1
                },
                busquedaEmpleado: '', datosResguardo: { idEmpleado: '', cantidad: 1, firmaBase64: null, latitud: null, longitud: null },
                historialArticulo: [], cargandoHistorial: false, canvas: null, ctx: null, isDrawing: false,
                solicitudesBaja: [],

                empleados: [], empleadosFiltrados: [], filtroEmpleado: '', filtroNivel: '',
                modalEquiposAbierto: false, empleadoSeleccionado: {}, equiposEmpleado: [],
                cargandoEquipos: false, cargandoPersonal: false, modalAprobarBajaAbierto: false,
                equipoADevolver: {}, firmaBase64: null, liberando: false, vinoDesdeBandeja: false,

                usuarios: [], busquedaUsuario: '', filtroNivelUsuario: '', filtroRol: '', modalResetAbierto: false,
                usuarioSeleccionado: {}, nuevaPassword: '',
                nuevoUsuario: { nombre: '', apellidos: '', email: '', username: '', password: '', cct: '', nivelEducativo: 'Primaria', nombreEscuela: '', rol: 'Admin' },
                centrosTrabajo: [],
                busquedaCT: '',
                modalCTAbierto: false,
                cargandoAuxiliar: false,
                nuevoCT: {
                    id: null, claveCT: '', unidadResp: '', subDireccion: '', departamento: '', nombreCT: '',
                    tipoVial: '', nombreVial: '', numExt: '', numInt: '', tipoAsent: '', nomAsent: '',
                    codPostal: '', municipio: '', localidad: '', vialidIzq: '', vialidDer: '',
                    vialidPost: '', refVialid: '', zonaEscolar: '', sector: '', director: ''
                },

                filtroSemestreReporte: '2026-2',
                filtroCategoriaReporte: '',
                filtroAreaReporte: '',
                filtroEstadoReporte: '',

                get articulosReporteFiltrados() {
                    return this.articulos.filter(a => {
                        const matchCat = !this.filtroCategoriaReporte || a.categoria === this.filtroCategoriaReporte;
                        const matchArea = !this.filtroAreaReporte || a.areaUbicacion === this.filtroAreaReporte;
                        const matchEst = !this.filtroEstadoReporte || (a.estadoFisico || 'BUENO') === this.filtroEstadoReporte;
                        return matchCat && matchArea && matchEst;
                    });
                },

                get metricasReporte() {
                    const lista = this.articulosReporteFiltrados;
                    const stockTotal = lista.reduce((acc, item) => acc + (Number(item.cantidadStock) || 0), 0);
                    const valorTotal = lista.reduce((acc, item) => {
                        const unitario = Number(item.valorInicial || item.precio || 0);
                        const cant = Number(item.cantidadStock) > 0 ? Number(item.cantidadStock) : 1;
                        return acc + (unitario * cant);
                    }, 0);
                    return {
                        stockTotal: stockTotal,
                        valorPatrimonial: valorTotal.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
                    };
                },

                exportarReporteCSV() {
                    const filas = [
                        ['FOLIO INVENTARIO', 'DESCRIPCION', 'MARCA', 'MODELO', 'SERIE', 'CATEGORIA', 'AREA', 'ESTADO FISICO', 'STOCK', 'VALOR INICIAL MXN']
                    ];
                    this.articulosReporteFiltrados.forEach(a => {
                        filas.push([
                            a.numeroInventario || 'S/N',
                            (a.descripcion || '').replace(/,/g, ' '),
                            (a.marca || '').replace(/,/g, ' '),
                            (a.modelo || '').replace(/,/g, ' '),
                            a.numeroSerie || a.serie || 'S/N',
                            a.categoria || 'General',
                            a.areaUbicacion || 'Almacen',
                            a.estadoFisico || 'BUENO',
                            a.cantidadStock ?? 0,
                            Number(a.valorInicial || a.precio || 0).toFixed(2)
                        ]);
                    });
                    const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + filas.map(e => e.join(",")).join("\n");
                    const encodedUri = encodeURI(csvContent);
                    const link = document.createElement("a");
                    link.setAttribute("href", encodedUri);
                    link.setAttribute("download", `Reporte_Semestral_SETAB_${this.filtroSemestreReporte}.csv`);
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    this.notificar("Archivo CSV descargado correctamente", "exito");
                },

                imprimirReporteSemestral() {
                    const ventana = window.open('', '_blank', 'width=1000,height=800');
                    const filasHtml = this.articulosReporteFiltrados.map(a => `
                        <tr>
                            <td style="border:1px solid #cbd5e1;padding:6px;font-family:monospace;font-weight:bold;color:#981A35;">${a.numeroInventario || 'S/N'}</td>
                            <td style="border:1px solid #cbd5e1;padding:6px;">${a.descripcion || ''} (${a.marca || 'S/N'})</td>

                procesarLecturaQR(textoQR) {
                    this.reproducirBeep();
                    this.detenerEscaner();
                    this.notificar("Código leído con éxito", "exito");
                    const raw = String(textoQR || '').trim();
                    const matchFolioEtiqueta = raw.match(/FOLIO:\s*([A-Za-z0-9\-_]+)/i);
                    const matchFolioSEP = raw.match(/(SE-AG-\d{2}-\d+)/i);
                    const folioExtraido = matchFolioEtiqueta
                        ? matchFolioEtiqueta[1].trim().toUpperCase()
                        : (matchFolioSEP ? matchFolioSEP[1].trim().toUpperCase() : raw);
                    this.buscarItemPorFolio(folioExtraido);
                },

                    this.buscarItemPorFolio(this.folioManual.trim().toUpperCase());

                async buscarItemPorFolio(folio) {
                    let encontrado = this.articulos.find(a => a.numeroInventario === folio || String(a.id) === folio || a.tokenQR === folio);

                    if (!encontrado) {
                        try {
                            const resp = await fetch(`${SETAB_CONFIG.backendUrl}/api/bienes/folio/${encodeURIComponent(folio)}`, {
                                method: 'GET', mode: 'cors', headers: { 'Authorization': `Bearer ${this.token}` }
                            });
                            if (resp.ok) {
                                encontrado = await resp.json();
                            }
                        } catch (e) {
                            console.error("Error buscando folio en servidor:", e);
                        }
                    }

                    if (encontrado) {
                        this.resultadoEscaneo = encontrado;
                        this.folioManual = '';
                    } else {
                        this.notificar("Equipo no encontrado en la base de datos", "error");
                        this.resultadoEscaneo = null;

                        const context = new (window.AudioContext || window.webkitAudioContext)();
                        const oscillator = context.createOscillator();
                        oscillator.type = "sine";
                        oscillator.frequency.value = 800;
                        oscillator.connect(context.destination);
                        oscillator.start();
                        setTimeout(() => { oscillator.stop(); }, 150);
                    } catch (e) { }
                },

                async renovarTokenKeycloak() {
                    const currentRefresh = this.refreshToken || sessionStorage.getItem('refreshTokenSETAB');
                    if (!currentRefresh) return false;
                    try {
                        const params = new URLSearchParams();
                        params.append('grant_type', 'refresh_token');
                        params.append('client_id', SETAB_CONFIG.clientId);
                        params.append('refresh_token', currentRefresh);

                        const nativeFetch = window.__originalSetabFetch || window.fetch.bind(window);
                        const resp = await nativeFetch(`${SETAB_CONFIG.keycloakUrl}/realms/${SETAB_CONFIG.realm}/protocol/openid-connect/token`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: params.toString()
                        });

                        if (resp.ok) {
                            const data = await resp.json();
                            if (data.access_token) {
                                this.token = data.access_token;
                                sessionStorage.setItem('tokenSETAB', data.access_token);
                            }
                            if (data.refresh_token) {
                                this.refreshToken = data.refresh_token;
                                sessionStorage.setItem('refreshTokenSETAB', data.refresh_token);
                            }
                            if (data.id_token) {
                                sessionStorage.setItem('idTokenSETAB', data.id_token);
                            }
                            return true;
                        }
                    } catch (e) {
                        console.warn("No fue posible refrescar token:", e);
                    }
                    return false;
                },

                init() {
                    if (!this.token) { window.location.href = '../login/index.html'; return; }

                    const self = this;
                    if (!window.__originalSetabFetch) {
                        window.__originalSetabFetch = window.fetch.bind(window);
                        window.fetch = async (input, initOpts = {}) => {
                            const urlStr = typeof input === 'string' ? input : (input instanceof URL ? input.toString() : (input.url || ''));
                            const esBackend = urlStr.startsWith(SETAB_CONFIG.backendUrl);

                            if (esBackend && initOpts && initOpts.headers && self.token) {
                                if (initOpts.headers instanceof Headers) {
                                    if (initOpts.headers.has('Authorization')) {
                                        initOpts.headers.set('Authorization', `Bearer ${self.token}`);
                                    }
                                } else if (typeof initOpts.headers === 'object' && initOpts.headers['Authorization']) {
                                    initOpts.headers['Authorization'] = `Bearer ${self.token}`;
                                }
                            }

                            let respuesta = await window.__originalSetabFetch(input, initOpts);
                            if (esBackend && respuesta.status === 401) {
                                const renovado = await self.renovarTokenKeycloak();
                                if (renovado && self.token) {
                                    const retryOpts = { ...initOpts, headers: { ...(initOpts.headers || {}), 'Authorization': `Bearer ${self.token}` } };
                                    respuesta = await window.__originalSetabFetch(input, retryOpts);
                                }
                            }
                            return respuesta;
                        };
                    }

                    setInterval(() => {
                        this.renovarTokenKeycloak();
                    }, 210000);

                    if (this.rolUsuario === 'SUPERADMIN') {
                        this.cambiarVista('catalogo', '../catalogo/catalogo.html');

                async cambiarVista(nombreVista, rutaArchivo = null) {
                    if (this.vistaActiva === nombreVista && this.contenidoVista !== '' && nombreVista !== 'resguardos' && nombreVista !== 'solicitudes') return;

                    if (this.vistaActiva === 'qr' && nombreVista !== 'qr') {
                        this.detenerEscaner();
                    }

                    this.vistaActiva = nombreVista;
                    if (nombreVista === 'resguardos' || nombreVista === 'solicitudes') {
                        this.vistaSubMenuActiva = nombreVista;
                    }

                    if (rutaArchivo) {
                        this.cargandoVista = true;
                        this.contenidoVista = '';

                        try {
                            const respuesta = await fetch(rutaArchivo);
                            if (respuesta.ok) {
                                this.contenidoVista = await respuesta.text();
                            } else {
                                this.contenidoVista = `<div class="bg-red-50 text-red-600 p-6 rounded-xl border border-red-200">Error al cargar ${rutaArchivo}</div>`;
                            }
                        } catch (error) {
                            console.error("Error SPA:", error);
                        } finally {
                            this.cargandoVista = false;
                            if (window.innerWidth < 1024) this.sidebarAbierto = false;
                        }
                    }
                    if (nombreVista === 'catalogo') { this.cargarArticulos(50); this.cargarCatalogosAuxiliares(); }
                    if (nombreVista === 'mi_escuela') this.cargarMisEquipos();
                    if (nombreVista === 'firmas') this.cargarPendientes();
                    if (nombreVista === 'usuarios') { this.cargarUsuarios(); this.cargarCentrosTrabajo(); }
                    if (nombreVista === 'resguardos') { this.filtrarLocal(); }
                    if (nombreVista === 'solicitudes') { this.cargarSolicitudesBaja(); }
                    if (nombreVista === 'centros_trabajo') this.cargarCentrosTrabajo();
                    if (nombreVista === 'catalogos_lista') this.cargarDatosCatalogoSelectivo();
                    if (nombreVista === 'qr') { this.cargarArticulos(1000); this.cambiarTabQR('generar'); }
                    if (nombreVista === 'reportes') { this.cargarArticulos(1000); this.cargarSolicitudesBaja(); }
                    if (nombreVista === 'historial') { this.busquedaFolioHistorial = ''; this.equipoAuditado = null; }
                },

                notificar(mensaje, tipo = 'exito') {
                    const id = Date.now();

                    if (this.filtroRol !== '') filtrados = filtrados.filter(u => u.rol === this.filtroRol);
                    if (this.busquedaUsuario !== '') {
                        const term = this.busquedaUsuario.toLowerCase();
                        filtrados = filtrados.filter(u => {

                            const usuario = u.username ? u.username.toLowerCase() : '';
                            const cct = u.cct ? u.cct.toLowerCase() : '';
                            return nombre.includes(term) || usuario.includes(term) || cct.includes(term);

                async procesarAprobacionBaja() {

                    this.firmaBase64 = document.getElementById('canvas-firma-superadmin').toDataURL("image/png"); this.liberando = true;

                        if (respuesta.status === 401) { this.cerrarSesion(); return; }
                        if (respuesta.ok) {
                            this.notificar("Baja autorizada. Enviada a bandeja del Director.", "exito");
                            this.cerrarModalAprobarBaja(); this.cargarSolicitudesBaja();

                        } else { this.notificar("Error al autorizar la baja.", "error"); }
                    } catch (error) { this.notificar("Error de red al autorizar.", "error"); } finally { this.liberando = false; this.limpiarFirma('canvas-firma-superadmin'); }
                },

                initCanvas(canvasId = 'canvas-firma') {
                    setTimeout(() => {
                        this.canvas = document.getElementById(canvasId);
                        if (!this.canvas) return;
                        this.ctx = this.canvas.getContext('2d');
                        this.ctx.lineWidth = 3; this.ctx.lineCap = 'round'; this.ctx.strokeStyle = '#0f172a';
                        this.canvas.onmousedown = (e) => this.startDrawing(e);
                        this.canvas.onmousemove = (e) => this.draw(e);
                        this.canvas.onmouseup = () => this.stopDrawing();
                        this.canvas.onmouseout = () => this.stopDrawing();
                        this.canvas.ontouchstart = (e) => { e.preventDefault(); this.startDrawing(e.touches[0]); };
                        this.canvas.ontouchmove = (e) => { e.preventDefault(); this.draw(e.touches[0]); };
                        this.canvas.ontouchend = () => this.stopDrawing();
                    }, 300);
                },
                startDrawing(e) {
                    if (!this.canvas || !this.ctx || !e) return;
                    this.isDrawing = true;
                    const rect = this.canvas.getBoundingClientRect();
                    const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
                    const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, y);
                },
                draw(e) {
                    if (!this.isDrawing || !this.canvas || !this.ctx || !e) return;
                    const rect = this.canvas.getBoundingClientRect();
                    const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
                    const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
                    this.ctx.lineTo(x, y); this.ctx.stroke(); this.ctx.beginPath(); this.ctx.moveTo(x, y);
                },
                stopDrawing() { this.isDrawing = false; if (this.ctx) this.ctx.beginPath(); },
                limpiarFirma(canvasId = 'canvas-firma') {
                    const c = document.getElementById(canvasId);
                    if (c && c.getContext) { c.getContext('2d').clearRect(0, 0, c.width, c.height); }
                },
                isCanvasBlank(canvasEl) {
                    if (!canvasEl) return true;
                    const context = canvasEl.getContext('2d');
                    const pixelBuffer = new Uint32Array(context.getImageData(0, 0, canvasEl.width, canvasEl.height).data.buffer);
                    return !pixelBuffer.some(color => color !== 0);
                },

                obtenerUbicacion() {
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(
                            (position) => { this.datosResguardo.latitud = position.coords.latitude; this.datosResguardo.longitud = position.coords.longitude; },
                            (error) => { this.notificar("Error de GPS", "error"); }
                        );
                    } else { this.notificar("GPS no soportado", "error"); }
                },

                async cargarArticulos(limite = 50) {
                    this.cargando = true; this.errorMensaje = '';
                    try {
                        let url = new URL(`${SETAB_CONFIG.backendUrl}/api/bienes`);
                        if (this.filtroBusqueda && this.filtroBusqueda.trim() !== '') url.searchParams.append('busqueda', this.filtroBusqueda.trim());
                        if (this.filtroCategoria) url.searchParams.append('categoria', this.filtroCategoria);
                        if (this.filtroArea) url.searchParams.append('area', this.filtroArea);
                        url.searchParams.append('page', this.paginaActual);
                        url.searchParams.append('size', limite);

                        const respuesta = await fetch(url, { method: 'GET', mode: 'cors', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.token}` } });
                        if (respuesta.status === 401) { this.cerrarSesion(); return; }

                        if (respuesta.ok) {
                            const datos = await respuesta.json();
                            if (Array.isArray(datos)) { this.articulos = datos; this.totalPaginas = 1; this.totalRegistros = datos.length; }
                            else { this.articulos = datos.articulos || []; this.totalPaginas = datos.pageCount || 1; this.totalRegistros = datos.totalRegistros || 0; }
                        } else { this.errorMensaje = "Error " + respuesta.status; }
                    } catch (error) { this.errorMensaje = 'Error de conexión'; } finally { this.cargando = false; }
                },

                async guardarNuevoArticulo() {
                    this.guardando = true;
                    try {
                        if (this.nuevoArticulo.precioSinIva !== null && this.nuevoArticulo.precioSinIva !== '' && !isNaN(parseFloat(this.nuevoArticulo.precioSinIva))) {
                            const base = parseFloat(this.nuevoArticulo.precioSinIva);
                            const totalNeto = parseFloat((base * 1.16).toFixed(2));
                            this.nuevoArticulo.precioSinIva = base;
                            this.nuevoArticulo.precio = totalNeto;
                            this.nuevoArticulo.valorInicial = totalNeto;
                        } else {
                            this.nuevoArticulo.precioSinIva = null;
                            this.nuevoArticulo.precio = null;
                            this.nuevoArticulo.valorInicial = null;
                        }
                        this.nuevoArticulo.numeroSerie = this.nuevoArticulo.serie ? String(this.nuevoArticulo.serie).trim().toUpperCase() : '';
                        this.nuevoArticulo.cantidadStock = parseFloat(this.nuevoArticulo.cantidadStock) || 1;
                        this.nuevoArticulo.estado = 'Activo';

                        const payload = { ...this.nuevoArticulo };
                        delete payload.id;
                        if (!payload.fechaFactura || String(payload.fechaFactura).trim() === '') payload.fechaFactura = null;
                        if (!payload.vigenciaPoliza || String(payload.vigenciaPoliza).trim() === '') payload.vigenciaPoliza = null;
                        if (!payload.fechaAdquisicion || String(payload.fechaAdquisicion).trim() === '') payload.fechaAdquisicion = null;

                        const respuesta = await fetch(`${SETAB_CONFIG.backendUrl}/api/bienes`, { method: 'POST', mode: 'cors', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.token}` }, body: JSON.stringify(payload) });

                async guardarCambios() {
                    this.guardando = true;
                    try {
                        this.articuloSeleccionado.cantidadStock = parseFloat(this.articuloSeleccionado.cantidadStock) || 0;
                        if (this.articuloSeleccionado.serie && !this.articuloSeleccionado.numeroSerie) {
                            this.articuloSeleccionado.numeroSerie = this.articuloSeleccionado.serie;
                        }
                        const payload = { ...this.articuloSeleccionado };
                        if (!payload.fechaFactura || String(payload.fechaFactura).trim() === '') payload.fechaFactura = null;
                        if (!payload.vigenciaPoliza || String(payload.vigenciaPoliza).trim() === '') payload.vigenciaPoliza = null;
                        if (!payload.fechaAdquisicion || String(payload.fechaAdquisicion).trim() === '') payload.fechaAdquisicion = null;
                        if (payload.precioSinIva === '' || isNaN(parseFloat(payload.precioSinIva))) payload.precioSinIva = null;
                        if (payload.valorInicial === '' || isNaN(parseFloat(payload.valorInicial))) payload.valorInicial = null;
                        if (payload.precio === '' || isNaN(parseFloat(payload.precio))) payload.precio = null;

                        const respuesta = await fetch(`${SETAB_CONFIG.backendUrl}/api/bienes/${this.articuloSeleccionado.id}`, { method: 'PUT', mode: 'cors', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.token}` }, body: JSON.stringify(payload) });
                        if (respuesta.ok) { this.cerrarModal(); this.cargarArticulos(); this.notificar("Cambios guardados", "exito"); }
                        else {
                            const err = await respuesta.json().catch(() => ({}));
                            this.notificar(err.error || "Error al guardar cambios", "error");
                        }
                    } catch (error) { this.notificar("Error de conexión", "error"); } finally { this.guardando = false; }
                },

                abrirModalResguardo(articulo) { this.articuloSeleccionado = articulo; this.busquedaEmpleado = ''; this.datosResguardo = { idEmpleado: '', cantidad: 1, latitud: null, longitud: null, firmaBase64: null }; this.modalResguardoAbierto = true; },
                cerrarModalResguardo() { this.modalResguardoAbierto = false; this.articuloSeleccionado = {}; },

                confirmarAsignacion() {
                    if (!this.datosResguardo.idEmpleado) { this.notificar("Selecciona un empleado", "error"); return; }
                    if (!this.datosResguardo.cantidad || this.datosResguardo.cantidad <= 0 || this.datosResguardo.cantidad > this.articuloSeleccionado.cantidadStock) { this.notificar("Cantidad inválida", "error"); return; }
                    this.modalResguardoAbierto = false; this.modalConfirmacionAbierto = true; this.initCanvas('canvas-firma');
                },
                cerrarModalesFirmas() { this.modalConfirmacionAbierto = false; this.limpiarFirma('canvas-firma'); this.modalResguardoAbierto = true; },

                async procesarResguardo() {
                    if (this.isCanvasBlank(document.getElementById('canvas-firma'))) { this.notificar("Firma requerida", "error"); return; }
                    this.datosResguardo.firmaBase64 = document.getElementById('canvas-firma').toDataURL("image/png"); this.guardando = true;
                    try {
                        const payload = { idEmpleado: parseInt(this.datosResguardo.idEmpleado), cantidad: parseFloat(this.datosResguardo.cantidad), firmaEmpleadoBase64: this.datosResguardo.firmaBase64 };
                        const respuesta = await fetch(`${SETAB_CONFIG.backendUrl}/api/resguardos/asignar/${this.articuloSeleccionado.id}`, { method: 'POST', mode: 'cors', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.token}` }, body: JSON.stringify(payload) });
                        if (respuesta.ok) { this.notificar("Asignado correctamente", "exito"); this.modalConfirmacionAbierto = false; this.cargarArticulos(); }
                        else {
                            const err = await respuesta.json().catch(() => ({}));
                            this.notificar(err.error || "Error en la asignación", "error");
                        }
                    } catch (error) { this.notificar("Error de conexión", "error"); } finally { this.guardando = false; this.limpiarFirma('canvas-firma'); }
                },

                abrirModalHistorial(articulo) { this.articuloSeleccionado = articulo; this.modalHistorialAbierto = true; this.cargarHistorial(articulo.id); },
                cerrarModalHistorial() { this.modalHistorialAbierto = false; setTimeout(() => { this.historialArticulo = []; }, 300); },

                iniciarProcesoBaja(idResguardo) { this.idBajaPendiente = idResguardo; this.textoConfirmacion = ''; this.modalSeguridadAbierto = true; },
                cerrarModalSeguridad() { this.modalSeguridadAbierto = false; this.idBajaPendiente = null; this.textoConfirmacion = ''; },

                async ejecutarBaja() {
                    if (this.textoConfirmacion.trim().toUpperCase() !== 'CONFIRMAR') { this.notificar("Palabra incorrecta", "error"); return; }
                    this.cargando = true;
                    try {
                        const respuesta = await fetch(`${SETAB_CONFIG.backendUrl}/api/resguardos/solicitar-baja/${this.idBajaPendiente}`, { method: 'PUT', mode: 'cors', headers: { 'Authorization': `Bearer ${this.token}` } });
                        if (respuesta.ok) { this.notificar("Baja solicitada", "exito"); this.cerrarModalSeguridad(); this.cargarMisEquipos(); }
                        else { this.notificar("Error al solicitar", "error"); }
                    } catch (e) { this.notificar("Error de conexión", "error"); } finally { this.cargando = false; }
                },

                abrirModalFirmaDirector(pendiente) {
                    this.pendienteSeleccionado = pendiente;
                    this.datosResguardo.latitud = null;
                    this.datosResguardo.longitud = null;
                    this.modalFirmaDirectorAbierto = true;
                    this.initCanvas('canvas-firma-director');
                },
                cerrarModalFirmaDirector() { this.modalFirmaDirectorAbierto = false; this.pendienteSeleccionado = {}; },

                async procesarFirmaDirector() {
                    if (this.isCanvasBlank(document.getElementById('canvas-firma-director'))) { this.notificar("Firma requerida", "error"); return; }
                    if (!this.datosResguardo.latitud || !this.datosResguardo.longitud) {
                        this.notificar("Debes capturar tu ubicación GPS obligatoria antes de firmar.", "error");
                        return;
                    }
                    this.guardando = true;
                    try {
                        const isBaja = this.pendienteSeleccionado.estadoResguardo === 'BAJA_EN_PROCESO';
                        const endpoint = isBaja ? `${SETAB_CONFIG.backendUrl}/api/resguardos/liberar/${this.pendienteSeleccionado.idResguardo}` : `${SETAB_CONFIG.backendUrl}/api/resguardos/firmar/${this.pendienteSeleccionado.idResguardo}`;
                        const payload = isBaja
                            ? { cantidad: this.pendienteSeleccionado.cantidadAsignada, firmaBase64: document.getElementById('canvas-firma-director').toDataURL("image/png"), latitudGPS: this.datosResguardo.latitud.toString(), longitudGPS: this.datosResguardo.longitud.toString() }
                            : { firmaBase64: document.getElementById('canvas-firma-director').toDataURL("image/png"), latitudGPS: this.datosResguardo.latitud.toString(), longitudGPS: this.datosResguardo.longitud.toString() };

                        const respuesta = await fetch(endpoint, { method: 'PUT', mode: 'cors', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.token}` }, body: JSON.stringify(payload) });
                        if (respuesta.ok) {
                            this.notificar("Autorizado", "exito");
                            this.descargarActa(this.pendienteSeleccionado.idResguardo, isBaja ? 'baja' : 'asignacion');
                            this.cerrarModalFirmaDirector(); this.cargarPendientes(); this.cargarMisEquipos();
                        } else {
                            const err = await respuesta.json().catch(() => ({}));
                            this.notificar(err.error || "Error al firmar", "error");
                        }
                    } catch (error) { this.notificar("Error de conexión", "error"); } finally { this.guardando = false; this.limpiarFirma('canvas-firma-director'); }
                },

                async descargarActa(idResguardo, tipoActa = 'asignacion') {
                    try {
                        this.notificar("Generando PDF...", "exito");
                        const endpoint = tipoActa === 'baja' ? 'pdf-baja' : 'pdf-asignacion';
                        const adminNameFront = encodeURIComponent(this.nombreUsuario);
                        const response = await fetch(`${SETAB_CONFIG.backendUrl}/api/resguardos/${endpoint}/${idResguardo}?adminName=${adminNameFront}`, { headers: { 'Authorization': `Bearer ${this.token}` } });
                        if (!response.ok) throw new Error('error');
                        const blob = await response.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `Acta_${tipoActa.toUpperCase()}_SETAB_Folio_${idResguardo}.pdf`;
                        document.body.appendChild(a); a.click(); a.remove();
                    } catch (error) { this.notificar("Error al descargar", "error"); }
                },

                formatearFecha(fechaArray) {
                    if (!fechaArray) return 'Fecha desconocida';
                    if (Array.isArray(fechaArray)) {
                        const [yyyy, mm, dd, hh, min] = fechaArray;
                        return `${dd}/${mm}/${yyyy} a las ${hh}:${min < 10 ? '0' + min : min}`;
                    }
                    const f = new Date(fechaArray);
                    return isNaN(f.getTime()) ? fechaArray : f.toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' });
                },

                cerrarSesion() {
                    const idToken = sessionStorage.getItem('idTokenSETAB');
                    sessionStorage.clear();
                    const baseUrl = window.location.origin;
                    if (!idToken) { window.location.href = '../login/index.html'; return; }
                    const logoutUrl = `${SETAB_CONFIG.keycloakUrl}/realms/${SETAB_CONFIG.realm}/protocol/openid-connect/logout?client_id=${SETAB_CONFIG.clientId}&post_logout_redirect_uri=${encodeURIComponent(baseUrl + '/login/index.html')}&id_token_hint=${idToken}`;
                    window.location.href = logoutUrl;
                },
                abrirModalTraspaso(empleado) {
                    this.empleadoSeleccionado = empleado;
                    this.idDirectorEntrante = '';
                    this.procesandoTraspaso = false;
                    this.modalTraspasoAbierto = true;
                    this.initCanvas('canvas-firma-traspaso');
                    this.empleadosGeneral = [...this.empleados];
                },

                cerrarModalTraspaso() {
                    this.modalTraspasoAbierto = false;
                    this.limpiarFirma('canvas-firma-traspaso');
                    setTimeout(() => {
                        this.empleadoSeleccionado = {};
                        this.idDirectorEntrante = '';
                    }, 300);
                },

                async procesarTraspaso() {
                    if (!this.idDirectorEntrante) {
                        this.notificar("Selecciona al Director Entrante", "error");
                        return;
                    }
                    if (this.isCanvasBlank(document.getElementById('canvas-firma-traspaso'))) {
                        this.notificar("El Director Saliente debe firmar", "error");
                        return;
                    }

                    this.procesandoTraspaso = true;
                    const firmaSaliente = document.getElementById('canvas-firma-traspaso').toDataURL("image/png");
                    const idEntrante = parseInt(this.idDirectorEntrante);

                    try {
                        const payload = {
                            idEmpleadoSaliente: this.empleadoSeleccionado.id_empleado,
                            idEmpleadoEntrante: idEntrante,
                            cct: this.empleadoSeleccionado.cct,
                            firmaSalienteBase64: firmaSaliente
                        };

                        const respuesta = await fetch(`${SETAB_CONFIG.backendUrl}/api/traspasos`, {
                            method: 'POST',
                            mode: 'cors',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.token}`
                            },
                            body: JSON.stringify(payload)
                        });

                        if (respuesta.ok) {
                            this.notificar("¡Traspaso ejecutado! Generando Acta de Entrega-Recepción...", "exito");
                            await this.imprimirActaTraspaso(idEntrante);
                            this.cerrarModalTraspaso();
                            this.cargarEmpleados();
                        } else {
                            const err = await respuesta.json().catch(() => ({}));
                            this.notificar(err.error || "Error en el traspaso", "error");
                        }
                    } catch (e) {
                        this.notificar("Error de conexión al servidor", "error");
                    } finally {
                        this.procesandoTraspaso = false;
                    }
                },

                async imprimirActaTraspaso(idEmpleadoTarget) {
                    try {
                        const resp = await fetch(`${SETAB_CONFIG.backendUrl}/api/traspasos/acta/${encodeURIComponent(idEmpleadoTarget)}`, {
                            headers: { 'Authorization': `Bearer ${this.token}` }
                        });
                        if (!resp.ok) return;
                        const acta = await resp.json();
                        const ventana = window.open('', '_blank', 'width=950,height=800');
                        const filas = (acta.bienesTraspasados || []).map(r => `
                            <tr>
                                <td style="border:1px solid #cbd5e1;padding:6px;font-family:monospace;">${r.articulo?.numeroInventario || 'S/N'}</td>
                                <td style="border:1px solid #cbd5e1;padding:6px;">${r.articulo?.descripcion || r.articulo?.marca || 'Equipo'}</td>
                                <td style="border:1px solid #cbd5e1;padding:6px;font-family:monospace;">${r.articulo?.numeroSerie || 'S/N'}</td>
                                <td style="border:1px solid #cbd5e1;padding:6px;text-align:center;">${r.cantidadAsignada || 1}</td>
                            </tr>
                        `).join('');

                        ventana.document.write(`
                            <html>
                            <head>
                                <title>Acta de Traspaso y Actualización CCT ${acta.cct}</title>
                                <style>
                                    body { font-family: Arial, sans-serif; padding: 30px; color: #1e293b; font-size: 12px; line-height: 1.5; }
                                    h1 { color: #981A35; font-size: 18px; margin-bottom: 4px; }
                                    table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 11px; }
                                    th { background: #981A35; color: #fff; padding: 7px; text-align: left; }
                                    .firmas { margin-top: 50px; display: flex; justify-content: space-between; text-align: center; }
                                    .caja-firma { width: 42%; border-top: 1px solid #000; padding-top: 8px; }
                                </style>
                            </head>
                            <body>
                                <h1>SECRETARÍA DE EDUCACIÓN DEL ESTADO DE TABASCO</h1>
                                <p><strong>ACTA DE ENTREGA-RECEPCIÓN Y ACTUALIZACIÓN DE RESGUARDO POR ROTACIÓN DE DIRECTOR</strong></p>
                                <p><strong>Clave CCT:</strong> ${acta.cct} | <strong>Centro de Trabajo:</strong> ${acta.nombreEscuela || 'S/N'} | <strong>Fecha:</strong> ${acta.fechaTraspaso}</p>
                                <p>Por medio de la presente se hace constar la transferencia de custodia y actualización de los bienes muebles propiedad de la SETAB asignados al Centro de Trabajo <strong>${acta.cct}</strong>, entregando el <strong>C. ${acta.directorSaliente}</strong> y recibiendo de conformidad el responsable <strong>C. ${acta.directorEntrante}</strong>, sin que ello implique baja del inventario central.</p>
                                <table>
                                    <thead>
                                        <tr><th>Folio Inventario</th><th>Descripción del Bien</th><th>No. Serie</th><th>Cantidad</th></tr>
                                    </thead>
                                    <tbody>${filas}</tbody>
                                </table>
                                <div class="firmas">
                                    <div class="caja-firma">
                                        ${acta.firmaSalienteBase64 ? `<img src="${acta.firmaSalienteBase64}" style="height:60px;display:block;margin:0 auto 5px auto;">` : '<div style="height:65px;"></div>'}
                                        <strong>ENTREGA (DIRECTOR SALIENTE)</strong><br>${acta.directorSaliente}
                                    </div>
                                    <div class="caja-firma">
                                        <div style="height:65px;"></div>
                                        <strong>RECIBE (DIRECTOR ENTRANTE)</strong><br>${acta.directorEntrante}
                                    </div>
                                </div>
                            </body>
                            </html>
                        `);
                        ventana.document.close();
                        setTimeout(() => { ventana.print(); }, 400);
                    } catch (e) {
                        console.error(e);
                    }
                },
                abrirModalQR(articulo) {
                    this.articuloSeleccionado = articulo;
                    this.modalQRAbierto = true;
                    this.$nextTick(() => {
                        const container = document.getElementById('qr-container') || document.getElementById('qr-container-vista');
                        if (!container) return;
                        container.innerHTML = '';
                        new QRCode(container, {
                            text: this.generarTextoQRArticulo(articulo),
                            width: 200,
                            height: 200,
                            colorDark: "#981A35",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.M
                        });
                    });
                },
                imprimirEtiquetaIndividual(articulo) {
                    if (!articulo || !articulo.id) return;
                    const previos = [...this.articulosSeleccionadosQR];
                    this.articulosSeleccionadosQR = [articulo.id];
                    this.imprimirEtiquetasSeleccionadas();
                    this.articulosSeleccionadosQR = previos;
                },
                cerrarModalQR() {
                    this.modalQRAbierto = false;
                }
            }
        }
    </script>
</body>

</html>
